<style>
/* Tata letak: cangkang aplikasi. HP = bilah atas + isi + navigasi bawah. Layar lebar = navigasi samping + isi berkolom. */
:root {
  --bg: #eef0ea; --surface: #ffffff; --surface-2: #f5f6f0; --ink: #1a1f16; --ink-2: #48513f; --muted: #6f7865; --line: #dce0d2;
  --accent: #46591f; --accent-ink: #ffffff; --accent-soft: #e5ebd3;
  --ok: #2c7a30; --ok-soft: #e2f0df; --warn: #a86400; --warn-soft: #faedd2; --bad: #bb3527; --bad-soft: #fae3df; --info: #2a6699; --info-soft: #e0ecf6;
  --s-potong: #b0721a; --s-maklon: #2a6699; --s-cek: #8455ab; --s-qc: #0d7f72; --s-jual: #4a7820;
  --shadow: 0 1px 2px rgba(26, 31, 22, .06), 0 6px 20px rgba(26, 31, 22, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px; --r-s: 8px;
  --nav-h: 62px; --top-h: 54px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11140e; --surface: #1a1e15; --surface-2: #22271b; --ink: #e9edde; --ink-2: #c3cab5; --muted: #909a82; --line: #30372a;
    --accent: #a8c256; --accent-ink: #151b08; --accent-soft: #2a331a;
    --ok: #7fc682; --ok-soft: #1c2d1c; --warn: #e4ab4e; --warn-soft: #33290f; --bad: #f08a7d; --bad-soft: #3a1c18; --info: #82b6e2; --info-soft: #172838;
    --s-potong: #e0a94e; --s-maklon: #82b6e2; --s-cek: #bb98de; --s-qc: #5fc9b9; --s-jual: #a8c256;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11140e; --surface: #1a1e15; --surface-2: #22271b; --ink: #e9edde; --ink-2: #c3cab5; --muted: #909a82; --line: #30372a;
  --accent: #a8c256; --accent-ink: #151b08; --accent-soft: #2a331a;
  --ok: #7fc682; --ok-soft: #1c2d1c; --warn: #e4ab4e; --warn-soft: #33290f; --bad: #f08a7d; --bad-soft: #3a1c18; --info: #82b6e2; --info-soft: #172838;
  --s-potong: #e0a94e; --s-maklon: #82b6e2; --s-cek: #bb98de; --s-qc: #5fc9b9; --s-jual: #a8c256;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body.lock { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 26px; } h2 { font-size: 21px; } h3 { font-size: 17px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.b { font-weight: 600; }
.right { text-align: right; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gap-s { gap: 6px; } .gap-l { gap: 16px; }
.cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
svg.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.ic.s { width: 16px; height: 16px; }

/* ---------- cangkang ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { height: var(--top-h); display: flex; align-items: center; gap: 10px; padding-inline: 16px; max-width: 1240px; margin-inline: auto; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
.brand i { font-style: normal; color: var(--accent); }
.logo-img { width: 32px; height: 32px; object-fit: contain; flex: none; }
.logo-img.l { width: 72px; height: 72px; }
.logo-img.xl { width: 132px; height: 132px; }
.splash { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; }
.splash .logo { font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.splash .logo i { font-style: normal; color: var(--accent); }
.splash .tag { color: var(--muted); font-size: 14px; }
.napas { animation: napas 1.4s ease-in-out infinite; }
@keyframes napas { 0%, 100% { opacity: .55; transform: scale(.95); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .napas { animation: none; } }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 6px; border-radius: 99px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync.busy .dot { background: var(--warn); animation: pulse 1s infinite; }
.sync.off .dot { background: var(--bad); }
.sync #sync-t { white-space: nowrap; }
@media (max-width: 480px) { .sync #sync-t { display: none; } .sync.off #sync-t { display: inline; } .who { max-width: 42vw; } }
@keyframes pulse { 50% { opacity: .35; } }
.who { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 600; max-width: 46vw; }
.ava { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; flex: none; }
.ava.l { width: 40px; height: 40px; font-size: 17px; }
.demo-bar { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 600; padding: 7px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; border-bottom: 1px solid var(--line); }
.demo-bar label { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.demo-bar select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 12.5px; color: var(--ink); width: auto; min-height: 30px; max-width: 60vw; }

.body { flex: 1 1 auto; display: flex; min-width: 0; max-width: 1240px; width: 100%; margin-inline: auto; }
.page { flex: 1 1 auto; min-width: 0; padding: 16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.nav { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { flex: 1 1 0; min-width: 0; height: var(--nav-h); background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.nav button.on { color: var(--accent); }
.nav button.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.nav .pip { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; text-align: center; font-weight: 700; }
@media (min-width: 900px) {
  .body { gap: 8px; }
  .nav { position: sticky; top: calc(var(--top-h) + 1px + env(safe-area-inset-top, 0px)); inset: auto; align-self: flex-start; flex: none; width: 200px; flex-direction: column; border: 0; background: none; padding: 16px 0 16px 16px; gap: 2px; }
  .nav button { flex: none; height: 44px; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; border-radius: var(--r-s); font-size: 14.5px; }
  .nav button.on { background: var(--accent-soft); }
  .nav button.on::before { display: none; }
  .nav .pip { position: static; margin-left: auto; }
  .page { padding: 20px 16px 40px; }
}

/* ---------- blok dasar ---------- */
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head .sub { color: var(--muted); font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card > h3 { margin-bottom: 10px; }
.sec-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sec-h h3 { flex: 1 1 auto; }
.grid { display: grid; gap: 12px; }
.g-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px) { .g-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .g-kpi { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.g-2 { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .g-2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.g-cards { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .g-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .g-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
button.kpi:hover { border-color: var(--accent); }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .v.money { font-size: 22px; padding-block: 4px; }
.kpi .u { font-size: 12px; color: var(--muted); }
.kpi.alert { border-color: var(--warn); background: var(--warn-soft); }
.kpi.alert .v { color: var(--warn); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.sz { display: inline-flex; gap: 5px; align-items: baseline; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sz b { font-weight: 600; color: var(--muted); font-size: 11.5px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14.5px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: none; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 10px; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn.loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.loading::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--muted); border-top-color: transparent; animation: spin .7s linear infinite; }
.btn.pri.loading::after { border-color: var(--accent-ink); border-top-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 7px 13px; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { position: relative; flex: 1 1 200px; min-width: 0; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input[type="search"] { padding-left: 38px; }
.nowrap { white-space: nowrap; }

input[type="text"], input[type="number"], input[type="date"], input[type="tel"], input[type="search"], input[type="password"], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); min-width: 0;
}
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
select { appearance: auto; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field > em { font-style: normal; font-size: 12.5px; color: var(--muted); }
.f-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.f-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--accent); }
.sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
.sizes label { display: flex; flex-direction: column; gap: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 6px; text-align: center; }
.sizes label b { font-family: var(--f-display); font-size: 15px; letter-spacing: .03em; }
.sizes label em { font-style: normal; font-size: 11px; color: var(--muted); min-height: 14px; }
.sizes input { text-align: center; min-height: 40px; padding: 4px; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sum-line b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.note { padding: 10px 12px; border-radius: var(--r-s); background: var(--info-soft); color: var(--info); font-size: 13.5px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.ok { background: var(--ok-soft); color: var(--ok); }

/* ---------- daftar ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); min-width: 0; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.list > .item:last-child { border-bottom: 0; }
button.item:hover, a.item:hover { background: var(--surface-2); }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .n { font-family: var(--f-display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.thumb { width: 48px; height: 48px; border-radius: 10px; background: var(--surface-2) center / cover no-repeat; border: 1px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; color: var(--muted); font-size: 15px; overflow: hidden; }
.thumb.l { width: 72px; height: 72px; font-size: 20px; }
.thumb.has { color: transparent; }

/* kartu PO */
.po { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: left; min-width: 0; width: 100%; }
button.po:hover { border-color: var(--accent); }
.po .name { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.15; letter-spacing: .01em; overflow-wrap: anywhere; }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stages.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stg .n { font-family: var(--f-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stg .l { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stg i { display: block; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.stg i b { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); }
.stg.z .n { color: var(--muted); font-weight: 600; }
.c-potong { --c: var(--s-potong); } .c-maklon { --c: var(--s-maklon); } .c-cek { --c: var(--s-cek); } .c-qc { --c: var(--s-qc); } .c-jual { --c: var(--s-jual); }

/* corong alur */
.flow { display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.flow b { display: block; background: var(--c); min-width: 3px; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
@media (min-width: 620px) { .legend { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.legend div { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; transform: translateY(1px); }
.legend span { font-size: 13px; color: var(--ink-2); flex: 1 1 auto; min-width: 0; }
.legend b { font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; }

/* tabel */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-s); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); }
.tbl .z { color: var(--muted); }

/* ---------- lembar (modal) ---------- */
#modal { position: fixed; inset: 0; z-index: 50; }
.layer { position: absolute; inset: 0; }
.scrim { position: absolute; inset: 0; background: rgba(10, 12, 8, .55); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 94%; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
.sheet-h h2 { flex: 1 1 auto; min-width: 0; font-size: 19px; }
.sheet-b { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; flex: none; }
.sheet-f .btn { flex: 1 1 0; }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px); border-radius: 16px; animation: none; }
  .sheet.wide { width: min(860px, calc(100% - 32px)); }
  .sheet.dialog { width: min(420px, calc(100% - 32px)); }
}
@media (prefers-reduced-motion: reduce) { .sheet, .sync.busy .dot, .btn.loading::after { animation: none; } }
#toast { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: 100%; }
.toast.bad { background: var(--bad); color: #fff; }

/* ---------- masuk ---------- */
.gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.gate-in { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px; }
.gate .logo { font-family: var(--f-display); font-weight: 700; font-size: 34px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.gate .logo i { font-style: normal; color: var(--accent); }
.gate .tag { color: var(--muted); font-size: 14px; }
.dots { display: flex; gap: 12px; justify-content: center; min-height: 20px; align-items: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.f { background: var(--accent); border-color: var(--accent); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button { height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 24px; }
.pad button:active { background: var(--accent-soft); }
.pad button.x { background: none; border-color: transparent; font-family: var(--f-body); font-size: 14px; font-weight: 600; color: var(--muted); }

/* ---------- slip ---------- */
.slip { border: 1px dashed var(--muted); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.slip .kop { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.slip .kop b { font-family: var(--f-display); font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }
.kv { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 4px 10px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.total-big { font-family: var(--f-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.prog { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog b { display: block; height: 100%; background: var(--accent); }
.steps { display: flex; flex-direction: column; gap: 0; counter-reset: s; }
.steps li { list-style: none; position: relative; padding: 0 0 14px 34px; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
ol.steps { margin: 0; padding: 0; }

</style>
</head>

   - Setiap baris punya id dari perangkat pengirim, jadi kirim ulang tidak dobel.
   ============================================================ */

var APP_VERSION = '1.2';

var SCHEMA = {
  Pegawai:   ['id','nama','divisi','pin','token','gagal','kunci','hp','catatan','aktif','dibuat'],
  Produk:    ['id','nama','series','gambar','tarifPotong','tarifJahit','catatan','aktif','dibuat'],
  PO:        ['id','noPO','jenis','produkId','nama','series','pelanggan','deadline','ukuran','total','bahan','catatan','gambar','status','dibuat','dibuatOleh','diubah','selesaiPada'],
  Potong:    ['id','poId','userId','tanggal','ukuran','total','bahan','kg','rol','tarif','upahId','catatan','dibuat'],
  SlipKirim: ['id','noSlip','poId','maklonId','tanggal','target','ukuran','total','upah','catatan','dibuatOleh','dibuat'],
  SlipSetor: ['id','noSlip','poId','maklonId','tanggal','ukuran','total','reject','upah','catatan','status','dibuatOleh','dibuat','diprosesOleh','diprosesPada','upahId'],
  QC:        ['id','poId','userId','maklonId','tanggal','ukuran','total','offline','perbaikan','reject','catatan','dibuat','setorId'],
  Gudang:    ['id','poId','userId','tanggal','ukuran','total','catatan','dibuat'],
  SlipUpah:  ['id','noSlip','pegawaiId','jenis','tanggal','itemIds','totalQty','totalUpah','potongan','dibayar','catatan','dibuatOleh','dibuat'],
  Gambar:    ['id','data','diubah'],
  Pengaturan:['key','value']
};

var TYPES = {
  total: 'num', reject: 'num', perbaikan: 'num', offline: 'num', upah: 'num', tarif: 'num', kg: 'num', rol: 'num',
  tarifPotong: 'num', tarifJahit: 'num', totalQty: 'num', totalUpah: 'num', potongan: 'num', dibayar: 'num', gagal: 'num',
  aktif: 'bool'
};

var DIVISI = {
  owner:  { label: 'Owner',         admin: true },
  admin:  { label: 'Admin',         admin: true },
  potong: { label: 'Tukang Potong', admin: false },
  jahit:  { label: 'Maklon Jahit',  admin: false },
  qc:     { label: 'QC',            admin: false }
};

var PO_STATUS = ['aktif', 'selesai', 'batal'];
var PO_JENIS = ['stok', 'pesanan'];
var LUNAS_LAMA = 'LAMA';          /* penanda upah data lama yang dianggap sudah lunas */
var MAX_GAMBAR = 48000;           /* batas panjang data gambar (batas sel Google Sheets 50.000) */
var MAX_SESI = 6;                 /* satu orang boleh login di beberapa perangkat sekaligus */
var MAX_GAGAL = 5;                /* salah PIN berturut-turut sebelum dikunci */
var MENIT_KUNCI = 15;
var HARI_ARSIP = 60;              /* PO selesai lebih lama dari ini tidak ikut dikirim ke perangkat kecuali diminta */

var DEFAULT_SETTINGS = {
  namaUsaha: 'Soldier',
  alamat: '',
  ukuran: ['S', 'M', 'L', 'XL', 'XXL'],
  upahPotong: 0,
  upahJahit: 0,
  linkApp: ''
};

/* ---------- util ---------- */
function corePad(n, w) { var s = String(n); while (s.length < w) s = '0' + s; return s; }
function coreYmd(d) { return d.getFullYear() + '-' + corePad(d.getMonth() + 1, 2) + '-' + corePad(d.getDate(), 2); }
function coreParseJSON(s, fallback) {
  if (s === null || s === undefined || s === '') return fallback;
  if (typeof s === 'object') return s;
  try { var v = JSON.parse(s); return (v === null || v === undefined) ? fallback : v; } catch (e) { return fallback; }
}
function coreNum(v) { var n = Number(v); return isNaN(n) || !isFinite(n) ? 0 : n; }
function coreInt(v) { return Math.round(coreNum(v)); }
function coreSumSizes(obj) { var t = 0; if (obj && typeof obj === 'object') for (var k in obj) t += coreNum(obj[k]); return t; }
function coreCleanSizes(obj) {
  var out = {};
  if (obj && typeof obj === 'object') for (var k in obj) {
    var n = coreInt(obj[k]); var key = String(k).trim().toUpperCase();
    if (n > 0 && key) out[key] = (out[key] || 0) + n;
  }
  return out;
}
function coreIsAdmin(u) { return !!(u && DIVISI[u.divisi] && DIVISI[u.divisi].admin); }
function coreTitle(s) {
  return String(s || '').toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }).trim();
}
function coreRibuan(n) {
  var neg = n < 0; var s = Math.round(Math.abs(coreNum(n))).toString(); var out = '';
  while (s.length > 3) { out = '.' + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? '-' : '') + s + out;
}
function coreRupiah(n) { var r = coreRibuan(n); return r.charAt(0) === '-' ? '-Rp ' + r.slice(1) : 'Rp ' + r; }
function coreTgl(s) { if (!s) return '-'; var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s); }
function coreHash(s) {
  var h1 = 0x811c9dc5, h2 = 5381; s = String(s);
  for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = (Math.imul(h2, 33) ^ c) >>> 0; }
  return h1.toString(36) + h2.toString(36);
}
function coreSizeOrder(list, pref) {
  var order = (pref || []).concat(['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', 'XXXXL', 'XXXXXL', '2XL', '3XL', '4XL', '5XL']);
  return list.slice().sort(function (a, b) {
    var ia = order.indexOf(a), ib = order.indexOf(b); if (ia < 0) ia = 999; if (ib < 0) ib = 999;
    return ia - ib || (a < b ? -1 : a > b ? 1 : 0);
  });
}

/* ---------- agregasi progres per PO (dihitung, tidak disimpan) ---------- */
function coreAggregate(poRows, potong, kirim, setor, qc, gudang) {
  var FIELDS = ['potong', 'kirim', 'terima', 'diajukan', 'qcOk', 'bigseller'];
  var byPo = {};
  function blankUk() { var o = {}; FIELDS.forEach(function (f) { o[f] = 0; }); return o; }
  function blankTot() { var o = blankUk(); o.reject = 0; o.qcOffline = 0; o.qcPerbaikan = 0; o.qcReject = 0; return o; }
  poRows.forEach(function (p) { byPo[p.id] = { total: blankTot(), ukuran: {}, maklon: {} }; });
  function uk(a, size) { if (!a.ukuran[size]) a.ukuran[size] = blankUk(); return a.ukuran[size]; }
  function addSizes(a, field, sizes, total) {
    a.total[field] += total;
    var s = coreParseJSON(sizes, {}); var sum = 0;
    for (var k in s) { var n = coreNum(s[k]); if (n > 0) { uk(a, k)[field] += n; sum += n; } }
    if (sum < total) uk(a, '?')[field] += total - sum;
  }
  function mk(a, id) { if (!a.maklon[id]) a.maklon[id] = { kirim: 0, terima: 0, reject: 0, diajukan: 0, sisa: 0, target: '' }; return a.maklon[id]; }
  potong.forEach(function (r) { var a = byPo[r.poId]; if (a) addSizes(a, 'potong', r.ukuran, r.total); });
  kirim.forEach(function (r) {
    var a = byPo[r.poId]; if (!a) return;
    addSizes(a, 'kirim', r.ukuran, r.total); var m = mk(a, r.maklonId); m.kirim += r.total;
    if (r.target && (!m.target || r.target > m.target)) m.target = r.target;
  });
  setor.forEach(function (r) {
    var a = byPo[r.poId]; if (!a) return; var m = mk(a, r.maklonId);
    if (r.status === 'diterima') { addSizes(a, 'terima', r.ukuran, r.total); a.total.reject += r.reject; m.terima += r.total; m.reject += r.reject; }
    else if (r.status === 'diajukan') { addSizes(a, 'diajukan', r.ukuran, r.total); m.diajukan += r.total + r.reject; }
  });
  qc.forEach(function (r) {
    var a = byPo[r.poId]; if (!a) return;
    addSizes(a, 'qcOk', r.ukuran, r.total);
    a.total.qcOffline += coreNum(r.offline); a.total.qcReject += coreNum(r.reject); a.total.qcPerbaikan += coreNum(r.perbaikan);
  });
  gudang.forEach(function (r) { var a = byPo[r.poId]; if (a) addSizes(a, 'bigseller', r.ukuran, r.total); });
  for (var id in byPo) {
    var a = byPo[id]; var t = a.total;
    t.siapKirim = t.potong - t.kirim;                                   /* sudah dipotong, belum ditugaskan ke maklon */
    t.sisaMaklon = 0;
    t.siapQC = t.terima - t.qcOk - t.qcOffline - t.qcPerbaikan - t.qcReject; /* sudah diterima, belum di-QC */
    t.stok = t.qcOk - t.bigseller;                                      /* lolos QC, belum diinput ke BigSeller */
    for (var s in a.ukuran) { var u = a.ukuran[s]; u.siapKirim = u.potong - u.kirim; u.sisaMaklon = u.kirim - u.terima - u.diajukan; u.siapQC = u.terima - u.qcOk; u.stok = u.qcOk - u.bigseller; }
    for (var m in a.maklon) { var x = a.maklon[m]; x.sisa = x.kirim - x.terima - x.reject - x.diajukan; t.sisaMaklon += x.sisa; }
  }
  return byPo;
}

/* ---------- teks slip untuk disalin ke WhatsApp ---------- */
function coreSizeText(ukuran, sizes) {
  var keys = coreSizeOrder(Object.keys(ukuran || {}), sizes); var parts = [];
  keys.forEach(function (k) { if (ukuran[k]) parts.push(k + ' ' + ukuran[k]); });
  return parts.join(' · ');
}
function coreSlipText(type, rec, ctx) {
  var st = ctx.settings || {}; var po = ctx.po || {}; var L = [];
  var uk = coreParseJSON(rec.ukuran, {});
  if (type === 'kirim' || type === 'setor') {
    var belumSlip = type === 'setor' && !rec.noSlip;
    L.push(type === 'kirim' ? '*SLIP PENUGASAN JAHIT*' : (belumSlip ? '*LAPORAN SETOR HASIL JAHIT*' : '*SLIP SETOR HASIL JAHIT*'));
    L.push(belumSlip ? 'Belum dihitung QC, slip belum terbit' : 'No: ' + rec.noSlip);
    L.push('Tanggal: ' + coreTgl(rec.tanggal));
    L.push('Maklon: ' + ((ctx.maklon && ctx.maklon.nama) || '-'));
    L.push('PO: ' + (po.noPO || '-'));
    L.push('Barang: ' + (po.nama || '-') + (po.series ? ' (' + po.series + ')' : ''));
    if (po.pelanggan) L.push('Pelanggan: ' + po.pelanggan);
    var s = coreSizeText(uk, st.ukuran); if (s) L.push('Ukuran: ' + s);
    L.push('Total: *' + coreRibuan(rec.total) + ' pcs*');
    if (type === 'setor' && rec.reject) L.push('Reject: ' + coreRibuan(rec.reject) + ' pcs');
    if (rec.upah && !belumSlip) L.push('Harga: ' + coreRupiah(rec.upah) + '/pcs' + (type === 'setor' ? ' = ' + coreRupiah(rec.total * rec.upah) : ''));
    if (type === 'kirim' && rec.target) L.push('Target selesai: ' + coreTgl(rec.target));
    if (type === 'setor') L.push('Status: ' + ({ diajukan: 'Menunggu dihitung QC', diterima: 'Diterima', ditolak: 'Ditolak' }[rec.status] || rec.status));
    if (rec.catatan) L.push('Catatan: ' + rec.catatan);
  } else {
    L.push('*SLIP UPAH ' + (rec.jenis === 'jahit' ? 'JAHIT' : 'POTONG') + '*');
    L.push('No: ' + rec.noSlip);
    L.push('Tanggal: ' + coreTgl(rec.tanggal));
    L.push('Nama: ' + ((ctx.pegawai && ctx.pegawai.nama) || '-'));
    L.push('');
    (ctx.items || []).forEach(function (it) {
      var p2 = (ctx.poMap && ctx.poMap[it.poId]) || {}; var rate = rec.jenis === 'jahit' ? it.upah : it.tarif;
      L.push('• ' + (p2.nama || 'Barang') + ' — ' + coreRibuan(it.total) + ' pcs x ' + coreRupiah(rate) + ' = ' + coreRupiah(it.total * rate));
    });
    L.push('');
    L.push('Total: ' + coreRibuan(rec.totalQty) + ' pcs = ' + coreRupiah(rec.totalUpah));
    if (rec.potongan) L.push('Potongan: ' + coreRupiah(rec.potongan));
    L.push('*Dibayar: ' + coreRupiah(rec.dibayar) + '*');
    if (rec.catatan) L.push('Catatan: ' + rec.catatan);
  }
  L.push('— ' + (st.namaUsaha || ''));
  return L.join('\n');
}

/* ============================================================ */
function createCore(store, env) {

  function fail(msg) { throw new Error(msg); }
  function nowIso() { return env.now().toISOString(); }
  function today() { return coreYmd(env.now()); }
  function tglOk(s) { s = String(s || ''); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ''; }
  function idOk(s) { s = String(s || ''); return /^[A-Za-z0-9_-]{6,48}$/.test(s) ? s : ''; }
  function teks(s, max) { return String(s === undefined || s === null ? '' : s).slice(0, max || 500); }

  function nextNo(prefix, rows, field, dateStr) {
    var d = dateStr ? new Date(dateStr + 'T00:00:00') : env.now();
    if (isNaN(d.getTime())) d = env.now();
    var ym = corePad(d.getFullYear() % 100, 2) + corePad(d.getMonth() + 1, 2);
    var pre = prefix + '-' + ym + '-'; var max = 0;
    for (var i = 0; i < rows.length; i++) {
      var v = String(rows[i][field] || '');
      if (v.indexOf(pre) === 0) { var n = parseInt(v.slice(pre.length), 10); if (n > max) max = n; }
    }
    return pre + corePad(max + 1, 3);
  }

  function settings() {
    var s = store.getSettings() || {}; var out = {};
    for (var k in DEFAULT_SETTINGS) out[k] = (s[k] === undefined || s[k] === null || s[k] === '') ? DEFAULT_SETTINGS[k] : s[k];
    if (!(out.ukuran instanceof Array) || !out.ukuran.length) out.ukuran = DEFAULT_SETTINGS.ukuran.slice();
    out.upahPotong = coreNum(out.upahPotong); out.upahJahit = coreNum(out.upahJahit);
    return out;
  }

  function users() { return store.read('Pegawai'); }
  function findUser(id) { var us = users(); for (var i = 0; i < us.length; i++) if (us[i].id === id) return us[i]; return null; }
  function findRow(sheet, id) { if (!id) return null; var rs = store.read(sheet); for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i]; return null; }
  function tokensOf(u) { return String(u.token || '').split(',').filter(Boolean); }

  function auth(payload) {
    var token = payload && String(payload.token || '');
    if (!token || token.length < 16) fail('Silakan login dulu.');
    var us = users();
    for (var i = 0; i < us.length; i++) if (tokensOf(us[i]).indexOf(token) >= 0) {
      if (!us[i].aktif) fail('Akun ini sudah dinonaktifkan.');
      return us[i];
    }
    fail('Sesi berakhir, silakan login lagi.');
  }
  function mustAdmin(me) { if (!coreIsAdmin(me)) fail('Hanya owner/admin yang boleh melakukan ini.'); }
  function pinOk(u) { return /^\d{4,6}$/.test(String(u.pin || '')); }
  function adaOwner() { return users().some(function (u) { return u.divisi === 'owner' && u.aktif; }); }
  /* Masa pemasangan = belum ada akun owner. Hanya di masa itu data lama boleh dimasukkan tanpa login,
     supaya sheet bisa diisi dulu sebelum owner membuat akunnya. Begitu owner ada, pintu ini tertutup. */
  function adminAtauPemasangan(p) {
    if (!adaOwner()) return null;
    var me = auth(p); mustAdmin(me); return me;
  }

  function publicUser(u, full) {
    var o = { id: u.id, nama: u.nama, divisi: u.divisi, aktif: !!u.aktif };
    if (full) { o.hp = u.hp || ''; o.catatan = u.catatan || ''; o.dibuat = u.dibuat || ''; o.adaPin = pinOk(u); }
    return o;
  }
  function genToken() { return env.id() + env.id() + env.id(); }
  function withParsed(rows, field, fb) {
    return rows.map(function (r) { var o = {}; for (var k in r) o[k] = r[k]; o[field] = coreParseJSON(r[field], fb); return o; });
  }
  function copy(r) { var o = {}; for (var k in r) o[k] = r[k]; return o; }

  /* ---------- data yang dikirim ke perangkat, disaring menurut divisi ---------- */
  function buildState(me, opt) {
    var semua = !!(opt && opt.semua);
    var st = settings();
    var allUsers = users();
    var produk = store.read('Produk');
    var po = withParsed(store.read('PO'), 'ukuran', {});
    var potong = withParsed(store.read('Potong'), 'ukuran', {});
    var kirim = withParsed(store.read('SlipKirim'), 'ukuran', {});
    var setor = withParsed(store.read('SlipSetor'), 'ukuran', {});
    var qc = withParsed(store.read('QC'), 'ukuran', {});
    var gudang = withParsed(store.read('Gudang'), 'ukuran', {});
    var upah = withParsed(store.read('SlipUpah'), 'itemIds', []);
    var agg = coreAggregate(po, potong, kirim, setor, qc, gudang);
    po.forEach(function (p) { p.agg = agg[p.id]; });

    var admin = coreIsAdmin(me);
    var out = { ver: store.version(), serverTime: nowIso(), appVersion: APP_VERSION, settings: st, me: publicUser(me, true), trimmed: false, semua: semua };

    /* data lama tidak dikirim supaya aplikasi tetap ringan */
    if (!semua) {
      var cut = coreYmd(new Date(env.now().getTime() - HARI_ARSIP * 86400000));
      var old = {}; var need = {};
      po.forEach(function (p) {
        if (p.status === 'aktif') return;
        var d = p.selesaiPada || String(p.diubah || p.dibuat || '').slice(0, 10);
        if (d && d < cut) old[p.id] = 1;
      });
      var trim = function (rows, payable) {
        return rows.filter(function (r) {
          if (!old[r.poId]) return true;
          if (payable && payable(r)) { need[r.poId] = 1; return true; }
          out.trimmed = true; return false;
        });
      };
      potong = trim(potong, function (r) { return !r.upahId && r.tarif > 0; });
      setor = trim(setor, function (r) { return !r.upahId && r.status !== 'ditolak'; });
      kirim = trim(kirim); qc = trim(qc); gudang = trim(gudang);
      var n0 = po.length;
      po = po.filter(function (p) { return !old[p.id] || need[p.id]; });
      if (po.length < n0) out.trimmed = true;
      var n1 = upah.length;
      upah = upah.filter(function (u) { return String(u.tanggal || '') >= cut; });
      if (upah.length < n1) out.trimmed = true;
    }

    if (admin) {
      out.users = allUsers.map(function (u) { return publicUser(u, true); });
      out.produk = produk;
      out.po = po; out.potong = potong; out.kirim = kirim; out.setor = setor; out.qc = qc; out.gudang = gudang; out.upah = upah;
      out.appUrl = env.appUrl ? env.appUrl() : '';
      return out;
    }

    out.users = allUsers.map(function (u) { return publicUser(u, false); });
    out.produk = produk.map(function (r) {
      var o = { id: r.id, nama: r.nama, series: r.series, gambar: r.gambar, aktif: r.aktif };
      if (me.divisi === 'potong') o.tarifPotong = r.tarifPotong;
      return o;
    });
    out.potong = []; out.kirim = []; out.setor = []; out.qc = []; out.gudang = []; out.upah = [];

    if (me.divisi === 'jahit') {
      var mine = function (r) { return r.maklonId === me.id; };
      /* maklon baru melihat harga di slip setor yang sudah terbit, bukan di slip penugasan */
      out.kirim = kirim.filter(mine).map(function (r) { var o = copy(r); o.upah = 0; return o; });
      out.setor = setor.filter(mine);
      out.upah = upah.filter(function (u) { return u.pegawaiId === me.id; });
      var ids = {}; out.kirim.forEach(function (k) { ids[k.poId] = 1; }); out.setor.forEach(function (s) { ids[s.poId] = 1; });
      out.po = po.filter(function (p) { return ids[p.id]; }).map(function (p) {
        var q = copy(p);
        q.agg = { total: {}, ukuran: {}, maklon: {}, saya: p.agg.maklon[me.id] || { kirim: 0, terima: 0, reject: 0, diajukan: 0, sisa: 0, target: '' } };
        return q;
      });
    } else if (me.divisi === 'potong') {
      out.po = po.filter(function (p) { return p.status === 'aktif'; });
      out.potong = potong.filter(function (r) { return r.userId === me.id; });
      out.upah = upah.filter(function (u) { return u.pegawaiId === me.id; });
    } else if (me.divisi === 'qc') {
      var pending = {}; setor.forEach(function (s) { if (s.status === 'diajukan') pending[s.poId] = 1; });
      out.po = po.filter(function (p) { return p.status === 'aktif' || pending[p.id]; });
      var shown = {}; out.po.forEach(function (p) { shown[p.id] = 1; });
      var hide = function (r) { var o = copy(r); o.upah = 0; o.upahId = o.upahId ? 'x' : ''; return o; };
      out.setor = setor.filter(function (r) { return shown[r.poId]; }).map(hide);
      out.kirim = kirim.filter(function (r) { return shown[r.poId]; }).map(hide);
      out.qc = qc.filter(function (r) { return shown[r.poId]; });
      out.gudang = gudang.filter(function (r) { return shown[r.poId]; });
    } else {
      out.po = [];
    }
    return out;
  }

  function loginResult(u, opt) {
    var token = genToken();
    var list = tokensOf(u); list.push(token);
    while (list.length > MAX_SESI) list.shift();
    store.update('Pegawai', u.id, { token: list.join(','), gagal: 0, kunci: '' });
    return { token: token, state: buildState(findUser(u.id), opt) };
  }

  /* ---------- aksi ---------- */
  var actions = {};

  actions.bootstrap = function (p) {
    var us = users();
    var st = settings();
    /* aplikasi per divisi hanya menerima daftar nama divisinya sendiri */
    var div = p && DIVISI[p.divisi] && !DIVISI[p.divisi].admin ? String(p.divisi) : '';
    var res = { needSetup: !adaOwner(), namaUsaha: st.namaUsaha, appVersion: APP_VERSION, divisi: div,
      users: us.filter(function (u) { return u.aktif && pinOk(u) && (!div || u.divisi === div); }).map(function (u) { return publicUser(u, false); }) };

      if (hasil <= 0) fail('Isi hasil perbaikan.');

  actions.createGudang = function (p) {

  actions.createUpah = function (p) {

    var seen = {}; var ids = (u.itemIds instanceof Array ? u.itemIds : []).map(String).filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; });
    if (!ids.length) fail('Pilih minimal satu item.');

  actions.deleteRecord = function (p) {

  /* aksi yang mengubah data dijalankan satu per satu di dalam kunci, lalu mengembalikan data terbaru */
  var WRITE = { setupOwner: 1, login: 1, logout: 1, changePin: 1, saveSettings: 1, saveUser: 1, saveProduk: 1, saveGambar: 1, importGambar: 1,

    tandaiLunas: 1, deleteRecord: 1, importRows: 1, ubahHarga: 1 };
  var NO_STATE = { setupOwner: 1, login: 1, logout: 1, importRows: 1, importGambar: 1 };

  function handle(action, payload) {
    var fn = actions[action];

}

    else if (nama && peg[id].nama.indexOf('Tukang ') === 0) peg[id].nama = coreTitle(nama);
    nameToId[peg[id].nama.toLowerCase()] = id;

  items.forEach(function (it) {

  var potongIds = Object.keys(peg).filter(function (id) { return peg[id].divisi === 'potong'; });
  var solePotong = potongIds.length === 1 ? potongIds[0] : '';

  if (!/^\d{4}-\d{2}-\d{2}$/.test(stamp)) stamp = coreYmd(new Date());

  var produkMap = {}; var sizeSet = {}; var tarifStat = {};

/* ---------- sambungan: Google Apps Script, server jarak jauh (PWA), atau mode coba ---------- */
var Api = (function () {
  var gas = !!(window.google && google.script && google.script.run);
  var remoteUrl = '';
  var local = null, localCore = null, clock = 0;
  var lockDiv = '';

  /* Aplikasi per divisi: link berakhiran d=potong, d=jahit, atau d=qc mengunci perangkat ke divisi itu.
     Link tanpa d (link owner) membuka kuncinya lagi. Harus dibaca sebelum # dihapus dari alamat. */
  function readDiv() {
    var d = '';
    if (gas) d = String(window.PK_DIV || '');
    else {
      var hash = String(location.hash || '');
      var h = hash.match(/[#&]d=([a-z]+)/); var q = String(location.search || '').match(/[?&]d=([a-z]+)/);
      var adaKunci = /[#&]k=/.test(hash);
      if (h) d = h[1]; else if (q) d = q[1]; else if (!adaKunci) d = LS.get('pk_div') || '';
      if (h || q || adaKunci) { if (DIV_APP[d]) LS.set('pk_div', d); else LS.del('pk_div'); }
    }
    lockDiv = DIV_APP[d] ? d : '';
  }

  function readInvite() {
    /* link undangan: .../#k=<kode deployment>. Kodenya disimpan di perangkat lalu dihapus dari alamat. */
    var m = String(location.hash || '').match(/[#&]k=([A-Za-z0-9_-]{20,})/);
    if (m) { LS.set('pk_api', m[1]); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    var k = LS.get('pk_api');
    remoteUrl = k ? 'https://script.google.com/macros/s/' + k + '/exec' : '';
  }
  readDiv();
  if (!gas) readInvite();

  function ensureLocal() {
    if (localCore) return;
    local = createLocalStore('pk_demo_db');
    localCore = createCore(local, { now: function () { return new Date(Date.now() - clock); }, id: newId });
  }
  function netError(e) {
    var err = new Error((typeof navigator !== 'undefined' && navigator.onLine === false) ? 'Tidak ada sambungan internet. Data belum terkirim, coba lagi.' : 'Server tidak bisa dihubungi. Coba lagi sebentar.');
    err.net = true; return err;
  }
  function unwrap(res, resolve, reject) {
    if (res && res.ok) resolve(res.data); else reject(new Error((res && res.error) || 'Terjadi kesalahan.'));
  }
  function call(action, payload) {
    var body = JSON.stringify({ action: action, payload: payload || {} });
    return new Promise(function (resolve, reject) {
      if (gas) {
        google.script.run
          .withSuccessHandler(function (s) { var res; try { res = JSON.parse(s); } catch (e) { return reject(new Error('Jawaban server tidak terbaca.')); } unwrap(res, resolve, reject); })
          .withFailureHandler(function (e) { reject(netError(e)); })
          .api(body);
      } else if (remoteUrl) {
        fetch(remoteUrl, { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' })
          .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
          .then(function (res) { unwrap(res, resolve, reject); }, function (e) { reject(netError(e)); });
      } else {
        ensureLocal();
        setTimeout(function () {
          try { resolve(JSON.parse(JSON.stringify(localCore.handle(action, JSON.parse(body).payload)))); }
          catch (e) { reject(e instanceof Error ? e : new Error(String(e))); }
        }, 60);
      }
    });
  }
  return {
    call: call,
    mode: function () { return gas ? 'gas' : (remoteUrl ? 'remote' : 'demo'); },
    local: function () { ensureLocal(); return local; },
    localCall: function (action, payload) { ensureLocal(); return localCore.handle(action, payload); },
    setClock: function (ms) { clock = ms; },
    connect: function (input) {
      var m = String(input || '').match(/\/macros\/s\/([A-Za-z0-9_-]{20,})/) || String(input || '').match(/k=([A-Za-z0-9_-]{20,})/) || String(input || '').trim().match(/^([A-Za-z0-9_-]{20,})$/);
      if (!m) return false;
      LS.set('pk_api', m[1]); remoteUrl = 'https://script.google.com/macros/s/' + m[1] + '/exec'; return true;
    },
    disconnect: function () { LS.del('pk_api'); remoteUrl = ''; },
    /* link undangan dibuka saat aplikasi sudah terbuka: alamatnya hanya berubah di bagian #, halaman tidak dimuat ulang */
    rehash: function () { if (gas || !/[#&]k=[A-Za-z0-9_-]{20,}/.test(String(location.hash || ''))) return false; readDiv(); readInvite(); return true; },
    div: function () { return lockDiv; },
    inviteLink: function (div) { var k = LS.get('pk_api'); return k && !gas ? location.origin + location.pathname + '#k=' + k + (DIV_APP[div] ? '&d=' + div : '') : ''; }
  };
})();

/* ---------- state ---------- */
var S = {
  boot: null, token: LS.get('pk_token') || '', state: null,
  tab: '', sub: {}, f: { q: '', poStatus: 'aktif', poTahap: '', poJenis: '', slipMaklon: '' },
  busy: 0, off: false, lastSync: 0, wantAll: false, pending: null,
  gate: { user: null, pin: '', err: '', setup: null },
  img: {}, imgWait: {}
};
var D = { user: {}, po: {}, produk: {} };

function me() { return S.state ? S.state.me : null; }
function isAdmin() { return coreIsAdmin(me()); }
function namaUser(id) { return (D.user[id] && D.user[id].nama) || '—'; }
function poNama(id) { var p = D.po[id]; return p ? p.nama : 'PO terhapus'; }

function index() {
  D = { user: {}, po: {}, produk: {} };
  var st = S.state; if (!st) return;
  st.users.forEach(function (u) { D.user[u.id] = u; });
  st.po.forEach(function (p) { D.po[p.id] = p; });
  st.produk.forEach(function (p) { D.produk[p.id] = p; });
}
function applyState(st) {
  if (!st || !st.me) return;
  S.state = st; S.lastSync = Date.now(); S.off = false;
  index();
}

/* panggil server; token ikut otomatis; jawaban aksi tulis membawa data terbaru */
function req(action, payload) {
  payload = payload || {};
  if (S.token && payload.token === undefined) payload.token = S.token;
  if (S.wantAll) payload.semua = true;
  S.busy++; paintSync();
  return Api.call(action, payload).then(function (res) {
    S.busy--; S.off = false;
    if (res && res.state && res.state.me) { applyState(res.state); res = res.data; refresh(); }
    paintSync();
    return res;
  }, function (err) {
    S.busy--; if (err.net) S.off = true; paintSync();
    if (/Sesi berakhir|Silakan login|dinonaktifkan/.test(err.message || '')) { signOutLocal(); }
    throw err;
  });
}
function signOutLocal() {
  S.token = ''; S.state = null; LS.del('pk_token'); S.gate = { user: null, pin: '', err: '', setup: null }; closeAll();
  boot();
}

/* sinkron ringan: server hanya mengirim data kalau ada yang berubah */
var syncTimer = null; var syncing = false;
function sync(force) {
  if (!S.token || !S.state || syncing) return Promise.resolve();
  if (!force && (document.hidden || S.busy > 0)) return Promise.resolve();
  syncing = true;
  var payload = { token: S.token, ver: force ? undefined : S.state.ver };
  if (S.wantAll) payload.semua = true;
  S.busy++; paintSync();
  return Api.call('sync', payload).then(function (res) {
    S.busy--; syncing = false; S.off = false; S.lastSync = Date.now();
    if (res && !res.same && res.me) { applyState(res); refresh(); }
    paintSync();
  }, function (err) {
    S.busy--; syncing = false; if (err.net) S.off = true; paintSync();
    if (/Sesi berakhir|Silakan login|dinonaktifkan/.test(err.message || '')) signOutLocal();
  });
}
function startSync() {
  if (syncTimer) return;
  syncTimer = setInterval(function () { sync(false); }, Api.mode() === 'demo' ? 60000 : 25000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(false); });
  window.addEventListener('online', function () { sync(true); });
}

/* ---------- gambar: diambil terpisah lalu disimpan di perangkat ---------- */
function gambarRef(obj) {
  if (!obj) return null;
  if (obj.gambar) return { id: obj.id, ver: obj.gambar };
  var pr = obj.produkId ? D.produk[obj.produkId] : null;
  if (pr && pr.gambar) return { id: pr.id, ver: pr.gambar };
  return null;
}
function thumb(obj, cls) {
  var ref = gambarRef(obj); var nama = obj ? obj.nama : '';
  return '<span class="thumb' + (cls ? ' ' + cls : '') + '"' + (ref ? ' data-img="' + esc(ref.id) + '" data-ver="' + esc(ref.ver) + '"' : '') + '>' + esc(inisial(nama)) + '</span>';
}
var imgTimer = null;
function hydrateImages() {
  var need = [];
  $$('[data-img]').forEach(function (el) {
    var id = el.getAttribute('data-img'), ver = el.getAttribute('data-ver');
    var c = S.img[id];
    if (!c) { var raw = LS.get('pk_img_' + id); if (raw) { var i = raw.indexOf('|'); c = S.img[id] = { ver: raw.slice(0, i), data: raw.slice(i + 1) }; } }
    if (c && c.ver === ver && c.data) { el.style.backgroundImage = 'url("' + c.data + '")'; el.classList.add('has'); }
    else if (!S.imgWait[id + ver] && need.indexOf(id) < 0) need.push(id);
  });
  if (!need.length || !S.token) return;
  clearTimeout(imgTimer);
  imgTimer = setTimeout(function () {
    var batch = need.slice(0, 30); var vers = {};
    batch.forEach(function (id) { var el = $('[data-img="' + id + '"]'); vers[id] = el ? el.getAttribute('data-ver') : ''; S.imgWait[id + vers[id]] = 1; });
    Api.call('getGambar', { token: S.token, ids: batch }).then(function (res) {
      var g = (res && res.gambar) || {};
      batch.forEach(function (id) {
        S.img[id] = { ver: vers[id], data: g[id] || '' };
        if (g[id]) LS.set('pk_img_' + id, vers[id] + '|' + g[id]);
      });
      hydrateImages();
    }, function () { batch.forEach(function (id) { delete S.imgWait[id + vers[id]]; }); });
  }, 150);
}
/* kecilkan gambar sampai muat di satu sel Google Sheets */
function shrinkDataUrl(src) {
  return new Promise(function (resolve, reject) {
    var im = new Image();
    im.onerror = function () { reject(new Error('Gambar tidak terbaca.')); };
    im.onload = function () {
      var side = 360, q = 0.8, out = '';
      for (var i = 0; i < 6; i++) {
        var k = Math.min(1, side / Math.max(im.width, im.height));
        var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length <= MAX_GAMBAR - 2000) return resolve(out);
        side = Math.round(side * 0.82); q -= 0.08;
      }
      reject(new Error('Gambar terlalu besar. Coba gambar lain.'));
    };
    im.src = src;
  });
}
function fileToThumb(file) {
  return new Promise(function (resolve, reject) {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Pilih file gambar.'));
    var fr = new FileReader();
    fr.onerror = function () { reject(new Error('Gambar tidak terbaca.')); };
    fr.onload = function () { shrinkDataUrl(String(fr.result)).then(resolve, reject); };
    fr.readAsDataURL(file);
  });
}

/* ---------- pesan singkat ---------- */
function toast(msg, bad) {
  var box = $('#toast'); if (!box) return;
  var el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, bad ? 5200 : 2600);
}
function copyText(text, okMsg) {
  var done = function () { toast(okMsg || 'Tersalin.'); };
  var fallback = function () {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { if (document.execCommand('copy')) done(); else toast('Tekan lama pada teks lalu pilih Salin.', true); } catch (e) { toast('Tekan lama pada teks lalu pilih Salin.', true); }
    document.body.removeChild(ta);
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
function paintSync() {
  var el = $('#sync'); if (!el) return;
  el.className = 'sync' + (S.off ? ' off' : (S.busy > 0 ? ' busy' : ''));
  var t = S.off ? 'Tidak tersambung' : (S.busy > 0 ? 'Menyimpan…' : (Api.mode() === 'demo' ? 'Mode coba' : 'Tersambung' + (S.lastSync ? ' · ' + jam(new Date(S.lastSync).toISOString()) : '')));
  var lab = $('#sync-t'); if (lab) lab.textContent = t;
}

/* ---------- lembar bertumpuk ---------- */
var sheets = [];
function sheetHtml(title, body, footer) {
  return '<div class="sheet-h"><h2 class="cut">' + esc(title) + '</h2><button class="icon-btn" data-a="close" aria-label="Tutup">' + ic('x') + '</button></div>' +
    '<div class="sheet-b">' + body + '</div>' + (footer ? '<div class="sheet-f">' + footer + '</div>' : '');
}
/* Tiap lembar punya elemen sendiri. Lembar di bawahnya disembunyikan, bukan digambar ulang,
   supaya isian form tidak hilang saat ada dialog konfirmasi di atasnya. */
function showSheets() {
  var m = $('#modal'); if (!m) return;
  m.hidden = !sheets.length; document.body.classList.toggle('lock', !!sheets.length);
  sheets.forEach(function (s, i) { s.node.hidden = i !== sheets.length - 1; });
}
function paintTop() {
  var s = sheets[sheets.length - 1]; if (!s) return;
  var sb = $('.sheet-b', s.node); var y = sb ? sb.scrollTop : 0;
  s.node.innerHTML = '<div class="scrim" data-a="close"></div><div class="sheet ' + s.cls + '" role="dialog" aria-modal="true">' + s.render() + '</div>';
  sb = $('.sheet-b', s.node); if (sb) sb.scrollTop = y;
  $$('[data-form]', s.node).forEach(recalc);
  hydrateImages();
}
function openSheet(render, opt) {
  var m = $('#modal'); if (!m) return;
  var node = document.createElement('div'); node.className = 'layer';
  m.appendChild(node);
  sheets.push({ render: render, live: !!(opt && opt.live), cls: (opt && opt.cls) || '', node: node });
  showSheets(); paintTop();
}
function dropSheet(i) {
  var s = sheets[i]; if (!s) return;
  var wasTop = i === sheets.length - 1;
  sheets.splice(i, 1); if (s.node.parentNode) s.node.parentNode.removeChild(s.node);
  showSheets();
  var t = sheets[sheets.length - 1]; if (wasTop && t && t.live) paintTop();
}
function closeSheet() { dropSheet(sheets.length - 1); }
function closeAll() { while (sheets.length) { var s = sheets.pop(); if (s.node.parentNode) s.node.parentNode.removeChild(s.node); } showSheets(); }
A.close = function (el) {
  var s = sheets[sheets.length - 1]; if (!s) return;
  if (el && el.classList.contains('scrim') && $('[data-form]', s.node)) return;   /* form tidak tertutup karena salah ketuk di luar */
  closeSheet();
};

function confirmBox(o, fn) {

};

/* tombol menunjukkan sedang memproses; kegagalan tampil sebagai pesan */
function act(el, p) {
  if (el) el.classList.add('loading');
  return p.then(function (v) { if (el) el.classList.remove('loading'); return v; },
    function (e) { if (el) el.classList.remove('loading'); toast((e && e.message) || 'Gagal. Coba lagi.', true); throw e; });
}

  if (inputAktif()) S.pending = true; else render();
  var top = sheets[sheets.length - 1];
  if (top && top.live) paintTop();
}
function paintList() { var el = $('#list'); if (el && S.listFn) { el.innerHTML = S.listFn(); hydrateImages(); } }

function slipSheet(type, id) {

  if (!rec) return sheetHtml('Slip', emptyBox('Slip ini sudah tidak ada.'));
  var ctx = slipCtx(type, rec); var st = S.state.settings; var h = ''; var foot = ''; var title;
  var admin = isAdmin(); var uang = admin || me().divisi === 'jahit' || me().divisi === 'potong';
  if (type === 'upah') {
    title = 'Slip upah ' + (rec.jenis === 'jahit' ? 'jahit' : 'potong');
    var rows = ctx.items.map(function (s) {
      var rate = rec.jenis === 'jahit' ? s.upah : s.tarif;
      return '<tr><td>' + esc(poNama(s.poId)) + '<br><span class="xs muted">' + esc(s.noSlip || 'Potong') + ' · ' + tgl(s.tanggal) + '</span></td><td>' + nf(s.total) + '</td><td>' + nf(rate) + '</td><td>' + nf(s.total * rate) + '</td></tr>';
    }).join('');
    h = '<div class="slip"><div class="kop"><span class="row gap-s">' + logoImg() + '<b>' + esc(st.namaUsaha) + '</b></span><span class="small b">' + esc(rec.noSlip) + '</span></div>' +
      '<dl class="kv"><dt>Tanggal</dt><dd>' + tgl(rec.tanggal) + '</dd><dt>Nama</dt><dd class="b">' + esc(ctx.pegawai.nama || '—') + '</dd></dl>' +
      (rows ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Barang</th><th>Pcs</th><th>Upah</th><th>Jumlah</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="small muted">Rincian item sudah diarsipkan.</p>') +
      '<dl class="kv"><dt>Total</dt><dd>' + nf(rec.totalQty) + ' pcs · ' + rp(rec.totalUpah) + '</dd>' + (rec.potongan ? '<dt>Potongan</dt><dd>' + rp(rec.potongan) + '</dd>' : '') +
      (rec.catatan ? '<dt>Catatan</dt><dd>' + esc(rec.catatan) + '</dd>' : '') + '</dl>' +
      '<div class="row"><span class="label grow">Dibayar</span><span class="total-big">' + rp(rec.dibayar) + '</span></div></div>';
  } else {
    /* laporan setor dari maklon baru menjadi slip (bernomor dan berharga) setelah dihitung QC */
    var belumSlip = type === 'setor' && rec.status !== 'diterima';
    title = type === 'kirim' ? 'Slip penugasan jahit' : (belumSlip ? 'Laporan setor' : 'Slip setor jahit');
    var po = ctx.po; var ss = STATUS_SETOR[rec.status] || [rec.status, ''];
    h = (belumSlip && rec.status === 'diajukan' ? '<div class="note">Belum menjadi slip. Slip dan harganya terbit setelah QC menghitung barang ini.</div>' : '') +
      '<div class="slip"><div class="kop"><span class="row gap-s">' + logoImg() + '<b>' + esc(st.namaUsaha) + '</b></span><span class="small b">' + esc(rec.noSlip || 'Belum ada slip') + '</span></div>' +
      '<dl class="kv"><dt>Tanggal</dt><dd>' + tgl(rec.tanggal) + '</dd><dt>Maklon</dt><dd class="b">' + esc(ctx.maklon.nama || '—') + '</dd>' +
      '<dt>Barang</dt><dd><span class="b">' + esc(po.nama || '—') + '</span><br><span class="xs muted">' + poMeta(po) + '</span></dd>' +
      (type === 'kirim' && rec.target ? '<dt>Target selesai</dt><dd>' + tgl(rec.target) + '</dd>' : '') +
      (type === 'setor' ? '<dt>Status</dt><dd><span class="chip ' + ss[1] + '">' + ss[0] + '</span>' + (rec.diprosesOleh ? ' <span class="xs muted">oleh ' + esc(namaUser(rec.diprosesOleh)) + '</span>' : '') + '</dd>' : '') +
      (uang && rec.upah && !belumSlip ? '<dt>Harga</dt><dd>' + rp(rec.upah) + ' / pcs' + (type === 'setor' ? ' = <span class="b">' + rp(rec.total * rec.upah) + '</span>' : '') + '</dd>' : '') +
      (admin && type === 'setor' && rec.status === 'diterima' && !rec.upah ? '<dt>Harga</dt><dd><span class="chip warn">Belum diatur</span></dd>' : '') +
      (type === 'setor' && rec.reject ? '<dt>Reject</dt><dd>' + nf(rec.reject) + ' pcs</dd>' : '') +
      (type === 'setor' && rec.upahId ? '<dt>Upah</dt><dd><span class="chip ok">Sudah dibayar</span></dd>' : '') +
      (rec.catatan ? '<dt>Catatan</dt><dd>' + esc(rec.catatan) + '</dd>' : '') + '</dl>' +
      '<div class="chips">' + sizeChips(rec.ukuran) + '</div>' +
      '<div class="row"><span class="label grow">Total</span><span class="total-big">' + nf(rec.total) + ' pcs</span></div></div>';
    if (type === 'setor' && rec.status === 'diajukan' && (admin || me().divisi === 'qc')) h += '<button class="btn pri block" data-a="terimaOpen" data-id="' + esc(rec.id) + '">' + ic('check') + 'Hitung &amp; terima</button>';
    if (type === 'setor' && rec.status === 'diterima' && admin && !rec.upahId) h += '<button class="btn" data-a="hargaOpen" data-s="SlipSetor" data-id="' + esc(rec.id) + '" data-v="' + rec.upah + '">' + ic('edit') + (rec.upah ? 'Ubah harga' : 'Atur harga') + '</button>';
  }
  var d = ' data-t="' + type + '" data-id="' + esc(rec.id) + '"';
  var belum = type === 'setor' && rec.status !== 'diterima';
  var bisaHapus = (type === 'kirim' && admin) || (type === 'upah' && admin) || (type === 'setor' && !rec.upahId && (admin || (rec.maklonId === me().id && rec.status === 'diajukan')));
  h += '<div class="row wrap">' + (bisaHapus ? '<button class="btn ghost sm" style="color:var(--bad)" data-a="slipDel"' + d + '>' + ic('trash', 's') + (type === 'upah' ? 'Batalkan slip' : (belum ? 'Batalkan laporan' : 'Hapus slip')) + '</button>' : '') + '</div>';
  foot = '<button class="btn" data-a="slipCopy"' + d + '>' + ic('copy') + 'Salin teks</button>' +
    (Api.mode() !== 'demo' && !belum && (type !== 'upah' || uang) ? '<button class="btn pri" data-a="slipPdf"' + d + '>' + ic('down') + 'PDF</button>' : '');
  return sheetHtml(title, h, foot);
}

A.slipCopy = function (el) {

A.slipPdf = function (el) {
  act(el, req('makePdf', { type: el.getAttribute('data-t'), id: el.getAttribute('data-id') })).then(function (res) {
    try {
      var bin = atob(res.base64); var u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = res.nama || 'slip.pdf'; a.target = '_blank'; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 8000);
      toast('PDF diunduh.');
    } catch (e) { toast('PDF tidak bisa dibuka di perangkat ini.', true); }
  }).catch(quiet);
};
A.slipDel = function (el) {
  var type = el.getAttribute('data-t'), id = el.getAttribute('data-id');
  var sheet = { kirim: 'SlipKirim', setor: 'SlipSetor', upah: 'SlipUpah' }[type];
  confirmBox({ title: type === 'upah' ? 'Batalkan slip upah?' : 'Hapus slip ini?', text: type === 'upah' ? 'Item di dalamnya kembali berstatus belum dibayar.' : 'Angka progres PO ikut berubah. Tindakan ini tidak bisa dibatalkan.', ok: type === 'upah' ? 'Batalkan slip' : 'Hapus', danger: true }, function (btn) {
    return act(btn, req('deleteRecord', { sheet: sheet, id: id })).then(function () { dropSheet(sheets.length - 2); toast(type === 'upah' ? 'Slip dibatalkan.' : 'Slip dihapus.'); });
  });
};
A.del = function (el) {
  var sheet = el.getAttribute('data-s'), id = el.getAttribute('data-id');
  confirmBox({ title: 'Hapus catatan ini?', text: 'Angka progres PO ikut berubah.', ok: 'Hapus', danger: true }, function (btn) {

   UI bagian 3 — layar Owner / Admin
   ============================================================ */

function poAktif() { return S.state.po.filter(function (p) { return p.status === 'aktif'; }); }
function maklonAktif() { return S.state.users.filter(function (u) { return u.divisi === 'jahit' && u.aktif; }); }

/* daftar hal yang menunggu tindakan owner, urut dari yang paling mendesak */
function tindakan() {
  var st = S.state, out = [];
  st.setor.forEach(function (s) {
    if (s.status !== 'diajukan') return;
    out.push({ w: 0, icon: 'inbox', cls: 'warn', t: namaUser(s.maklonId) + ' melapor setor ' + nf(s.total) + ' pcs', d: poNama(s.poId) + ' · belum dihitung QC · ' + lalu(s.dibuat), btn: 'Hitung', a: 'terimaOpen', id: s.id });
  });
  poAktif().forEach(function (po) {
    var m = (po.agg && po.agg.maklon) || {};
    Object.keys(m).forEach(function (mid) {
      var x = m[mid]; var d = selisihHari(x.target);
      if (x.sisa > 0 && d !== null && d < 0) out.push({ w: 1, n: x.sisa, icon: 'clock', cls: 'bad', t: namaUser(mid) + ' telat ' + (-d) + ' hari', d: po.nama + ' · sisa ' + nf(x.sisa) + ' pcs · target ' + tgl(x.target), btn: 'Lihat', a: 'poOpen', id: po.id });
    });
    if (po.jenis === 'pesanan' && po.deadline) {
      var dl = selisihHari(po.deadline);
      if (dl !== null && dl <= 3) out.push({ w: dl < 0 ? 1 : 2, icon: 'alert', cls: dl < 0 ? 'bad' : 'warn', t: 'Pesanan ' + (po.pelanggan || '') + (dl < 0 ? ' lewat ' + (-dl) + ' hari' : (dl === 0 ? ' jatuh tempo hari ini' : ' jatuh tempo ' + dl + ' hari lagi')), d: po.nama + ' · ' + po.noPO, btn: 'Lihat', a: 'poOpen', id: po.id });
    }
    var t = T(po);
    if (t.siapKirim > 0) out.push({ w: 3, n: t.siapKirim, icon: 'send', cls: 'info', t: nf(t.siapKirim) + ' pcs sudah dipotong, belum ditugaskan ke maklon', d: po.nama + ' · ' + po.noPO, btn: 'Tugaskan', a: 'kirimOpen', id: po.id });
  });
  /* divisi yang belum punya akun sama sekali */
  [['qc', 'Belum ada akun QC', 'Setoran maklon baru bisa dihitung QC setelah akunnya dibuat. Sementara itu owner yang menghitung.'],
   ['potong', 'Belum ada akun tukang potong', 'Hasil potong belum bisa dicatat dari HP tukang potong.'],
   ['jahit', 'Belum ada akun maklon jahit', 'Bahan belum bisa ditugaskan ke maklon.']].forEach(function (x) {
    if (!st.users.some(function (u) { return u.aktif && u.divisi === x[0]; })) out.push({ w: 0, icon: 'user', cls: 'warn', t: x[1], d: x[2], btn: 'Tambah', a: 'pegawaiBaru', id: x[0] });
  });
  /* slip yang sudah terbit tetapi harganya masih kosong */
  st.setor.forEach(function (s) {
    if (s.status === 'diterima' && !s.upahId && !(s.upah > 0) && s.total > 0) out.push({ w: 0, icon: 'wallet', cls: 'warn', t: 'Slip ' + s.noSlip + ' belum punya harga', d: namaUser(s.maklonId) + ' · ' + poNama(s.poId) + ' · ' + nf(s.total) + ' pcs', btn: 'Atur harga', a: 'hargaOpen', id: s.id, s: 'SlipSetor' });
  });
  st.potong.forEach(function (r) {
    if (!r.upahId && !(r.tarif > 0) && r.total > 0) out.push({ w: 2, icon: 'wallet', cls: 'warn', t: 'Potongan ' + tgl(r.tanggal) + ' belum punya harga', d: namaUser(r.userId) + ' · ' + poNama(r.poId) + ' · ' + nf(r.total) + ' pcs', btn: 'Atur harga', a: 'hargaOpen', id: r.id, s: 'Potong' });
  });
  var tanpaPin = st.users.filter(function (u) { return u.aktif && u.adaPin === false; });
  if (tanpaPin.length) out.push({ w: 0, icon: 'key', cls: 'warn', t: tanpaPin.length + ' pegawai belum punya PIN', d: tanpaPin.map(function (u) { return u.nama; }).join(', ') + ' belum bisa masuk aplikasi', btn: 'Buat PIN', a: 'goPegawai', id: '' });
  out.sort(function (a, b) { return (a.w - b.w) || ((b.n || 0) - (a.n || 0)); });   /* yang paling mendesak dulu, lalu yang jumlahnya paling besar */
  return out;
}

  var flow = [['Belum dikirim', k.kirim, 'c-potong'], ['Di maklon', k.maklon, 'c-maklon'], ['Menunggu dicek', k.cekPcs, 'c-cek'], ['Siap QC', k.qc, 'c-qc'], ['Belum BigSeller', k.bs, 'c-jual']];

  flowHtml += '<div class="legend">' + flow.map(function (f) { return '<div class="' + f[2] + '"><i></i><span>' + f[0] + '</span><b>' + nf(f[1]) + '</b></div>'; }).join('') +
    (k.perbaikan ? '<div><i style="background:var(--bad)"></i><span>Sedang diperbaiki</span><b>' + nf(k.perbaikan) + '</b></div>' : '') + '</div>';

/* Antrean QC: slip setor yang sudah dihitung dan belum selesai diperiksa, yang paling lama di atas.
   Hasil QC yang dicatat per slip mengurangi slip itu. Hasil QC lama yang dicatat per PO (tanpa slip)
   dianggap menghabiskan slip PO itu mulai dari yang paling tua. */
function antreanQC() {
  var st = S.state; var perSlip = {}; var perSlipUk = {}; var tanpaSlip = {};
  st.qc.forEach(function (q) {
    var n = coreNum(q.total) + coreNum(q.offline) + coreNum(q.reject) + coreNum(q.perbaikan);
    if (q.setorId) {
      perSlip[q.setorId] = (perSlip[q.setorId] || 0) + n;
      var u = perSlipUk[q.setorId] = perSlipUk[q.setorId] || {}; for (var s in q.ukuran) u[s] = (u[s] || 0) + coreNum(q.ukuran[s]);
    } else tanpaSlip[q.poId] = (tanpaSlip[q.poId] || 0) + n;
  });
  var slips = st.setor.filter(function (s) { return s.status === 'diterima' && s.total > 0 && D.po[s.poId] && D.po[s.poId].status === 'aktif'; })
    .sort(function (a, b) { return String(a.tanggal) + String(a.diprosesPada || a.dibuat) < String(b.tanggal) + String(b.diprosesPada || b.dibuat) ? -1 : 1; });
  var out = [];
  slips.forEach(function (s) {
    var sisa = s.total - (perSlip[s.id] || 0);
    var lama = tanpaSlip[s.poId] || 0; var ambil = Math.min(pos(sisa), pos(lama)); sisa -= ambil; tanpaSlip[s.poId] = lama - ambil;
    if (sisa <= 0) return;
    var uk = {}; var ada = false;
    if (!ambil) for (var k in s.ukuran) { var r = coreNum(s.ukuran[k]) - ((perSlipUk[s.id] || {})[k] || 0); if (r > 0) { uk[k] = r; ada = true; } }
    out.push({ s: s, sisa: sisa, uk: ada ? uk : null });
  });
  return out;
}

  });

A.imporRun = function () {

    if (!imp.q.length) return sync(true).then(function () { imp.stage = 'selesai'; if (S.imp === imp) paintTop(); });

function boot() {
  if (Api.mode() === 'demo' && window.PK_HOSTED) { S.gate.loading = false; S.gate.bootErr = ''; S.gate.needLink = true; S.boot = null; render(); return; }
  S.gate.needLink = false;
  S.gate.loading = true; S.gate.bootErr = ''; render();
  var payload = { token: S.token }; if (S.wantAll) payload.semua = true;
  if (Api.div()) payload.divisi = Api.div();
  Api.call('bootstrap', payload).then(function (res) {
    S.gate.loading = false; S.boot = res;
    /* perangkat yang dikunci ke satu divisi tidak dipakai masuk oleh divisi lain */
    if (res.state && Api.div() && res.state.me.divisi !== Api.div()) { res.state = null; S.token = ''; LS.del('pk_token'); LS.del('pk_last'); }
    if (Api.mode() === 'demo' && res.needSetup && !LS.get('pk_demo_seeded')) { seedDemo(); return; }
    if (res.state) { S.token = res.token; applyState(res.state); startSync(); }
    else {
      if (S.token) { S.token = ''; LS.del('pk_token'); }
      var last = LS.get('pk_last');
      if (last && !res.needSetup) S.gate.user = res.users.filter(function (u) { return u.id === last; })[0] || null;
    }
    render();
  }, function (e) { S.gate.loading = false; S.gate.bootErr = (e && e.message) || 'Gagal memuat.'; render(); });
}
