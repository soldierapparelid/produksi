<style>
/* Tata letak: cangkang aplikasi. HP = bilah atas + isi + navigasi bawah. Layar lebar = navigasi samping + isi berkolom. */
:root {
  --bg: #eef0ea; --surface: #ffffff; --surface-2: #f5f6f0; --ink: #1a1f16; --ink-2: #48513f; --muted: #6f7865; --line: #dce0d2;
  --accent: #46591f; --accent-ink: #ffffff; --accent-soft: #e5ebd3;
  --ok: #2c7a30; --ok-soft: #e2f0df; --warn: #a86400; --warn-soft: #faedd2; --bad: #bb3527; --bad-soft: #fae3df; --info: #2a6699; --info-soft: #e0ecf6;
  --s-potong: #b0721a; --s-maklon: #2a6699; --s-cek: #8455ab; --s-qc: #0d7f72; --s-jual: #4a7820;
  --shadow: 0 1px 2px rgba(26, 31, 22, .06), 0 6px 20px rgba(26, 31, 22, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px; --r-s: 8px;
  --nav-h: 62px; --top-h: 54px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11140e; --surface: #1a1e15; --surface-2: #22271b; --ink: #e9edde; --ink-2: #c3cab5; --muted: #909a82; --line: #30372a;
    --accent: #a8c256; --accent-ink: #151b08; --accent-soft: #2a331a;
    --ok: #7fc682; --ok-soft: #1c2d1c; --warn: #e4ab4e; --warn-soft: #33290f; --bad: #f08a7d; --bad-soft: #3a1c18; --info: #82b6e2; --info-soft: #172838;
    --s-potong: #e0a94e; --s-maklon: #82b6e2; --s-cek: #bb98de; --s-qc: #5fc9b9; --s-jual: #a8c256;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11140e; --surface: #1a1e15; --surface-2: #22271b; --ink: #e9edde; --ink-2: #c3cab5; --muted: #909a82; --line: #30372a;
  --accent: #a8c256; --accent-ink: #151b08; --accent-soft: #2a331a;
  --ok: #7fc682; --ok-soft: #1c2d1c; --warn: #e4ab4e; --warn-soft: #33290f; --bad: #f08a7d; --bad-soft: #3a1c18; --info: #82b6e2; --info-soft: #172838;
  --s-potong: #e0a94e; --s-maklon: #82b6e2; --s-cek: #bb98de; --s-qc: #5fc9b9; --s-jual: #a8c256;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body.lock { overflow: hidden; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 26px; } h2 { font-size: 21px; } h3 { font-size: 17px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.b { font-weight: 600; }
.right { text-align: right; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gap-s { gap: 6px; } .gap-l { gap: 16px; }
.cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
svg.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.ic.s { width: 16px; height: 16px; }

/* ---------- cangkang ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { height: var(--top-h); display: flex; align-items: center; gap: 10px; padding-inline: 16px; max-width: 1240px; margin-inline: auto; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; }
.brand i { font-style: normal; color: var(--accent); }
.logo-img { width: 32px; height: 32px; object-fit: contain; flex: none; }
.logo-img.l { width: 72px; height: 72px; }
.logo-img.xl { width: 132px; height: 132px; }
.splash { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; text-align: center; }
.splash .logo { font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.splash .logo i { font-style: normal; color: var(--accent); }
.splash .tag { color: var(--muted); font-size: 14px; }
.napas { animation: napas 1.4s ease-in-out infinite; }
@keyframes napas { 0%, 100% { opacity: .55; transform: scale(.95); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .napas { animation: none; } }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 6px; border-radius: 99px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync.busy .dot { background: var(--warn); animation: pulse 1s infinite; }
.sync.off .dot { background: var(--bad); }
.sync #sync-t { white-space: nowrap; }
@media (max-width: 480px) { .sync #sync-t { display: none; } .sync.off #sync-t { display: inline; } .who { max-width: 42vw; } }
@keyframes pulse { 50% { opacity: .35; } }
.who { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 4px; font-size: 13px; font-weight: 600; max-width: 46vw; }
.ava { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: 13px; flex: none; }
.ava.l { width: 40px; height: 40px; font-size: 17px; }
.demo-bar { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 600; padding: 7px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; border-bottom: 1px solid var(--line); }
.demo-bar label { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.demo-bar select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 12.5px; color: var(--ink); width: auto; min-height: 30px; max-width: 60vw; }

.body { flex: 1 1 auto; display: flex; min-width: 0; max-width: 1240px; width: 100%; margin-inline: auto; }
.page { flex: 1 1 auto; min-width: 0; padding: 16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.nav { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav button { flex: 1 1 0; min-width: 0; height: var(--nav-h); background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: relative; }
.nav button.on { color: var(--accent); }
.nav button.on::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.nav .pip { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; text-align: center; font-weight: 700; }
@media (min-width: 900px) {
  .body { gap: 8px; }
  .nav { position: sticky; top: calc(var(--top-h) + 1px + env(safe-area-inset-top, 0px)); inset: auto; align-self: flex-start; flex: none; width: 200px; flex-direction: column; border: 0; background: none; padding: 16px 0 16px 16px; gap: 2px; }
  .nav button { flex: none; height: 44px; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; border-radius: var(--r-s); font-size: 14.5px; }
  .nav button.on { background: var(--accent-soft); }
  .nav button.on::before { display: none; }
  .nav .pip { position: static; margin-left: auto; }
  .page { padding: 20px 16px 40px; }
}

/* ---------- blok dasar ---------- */
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head .sub { color: var(--muted); font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card > h3 { margin-bottom: 10px; }
.sec-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.sec-h h3 { flex: 1 1 auto; }
.grid { display: grid; gap: 12px; }
.g-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px) { .g-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .g-kpi { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.g-2 { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .g-2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.g-cards { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .g-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .g-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
button.kpi:hover { border-color: var(--accent); }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .v.money { font-size: 22px; padding-block: 4px; }
.kpi .u { font-size: 12px; color: var(--muted); }
.kpi.alert { border-color: var(--warn); background: var(--warn-soft); }
.kpi.alert .v { color: var(--warn); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.sz { display: inline-flex; gap: 5px; align-items: baseline; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sz b { font-weight: 600; color: var(--muted); font-size: 11.5px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14.5px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: none; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 10px; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn.loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.loading::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--muted); border-top-color: transparent; animation: spin .7s linear infinite; }
.btn.pri.loading::after { border-color: var(--accent-ink); border-top-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 7px 13px; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { position: relative; flex: 1 1 200px; min-width: 0; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input[type="search"] { padding-left: 38px; }
.nowrap { white-space: nowrap; }

input[type="text"], input[type="number"], input[type="date"], input[type="tel"], input[type="search"], input[type="password"], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); min-width: 0;
}
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
select { appearance: auto; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field > em { font-style: normal; font-size: 12.5px; color: var(--muted); }
.f-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.f-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 20px; height: 20px; margin-top: 1px; flex: none; accent-color: var(--accent); }
.sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
.sizes label { display: flex; flex-direction: column; gap: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 6px; text-align: center; }
.sizes label b { font-family: var(--f-display); font-size: 15px; letter-spacing: .03em; }
.sizes label em { font-style: normal; font-size: 11px; color: var(--muted); min-height: 14px; }
.sizes input { text-align: center; min-height: 40px; padding: 4px; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sum-line b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.note { padding: 10px 12px; border-radius: var(--r-s); background: var(--info-soft); color: var(--info); font-size: 13.5px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.ok { background: var(--ok-soft); color: var(--ok); }

/* ---------- daftar ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); min-width: 0; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.list > .item:last-child { border-bottom: 0; }
button.item:hover, a.item:hover { background: var(--surface-2); }
.item .t { font-weight: 600; overflow-wrap: anywhere; }
.item .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.item .n { font-family: var(--f-display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.thumb { width: 48px; height: 48px; border-radius: 10px; background: var(--surface-2) center / cover no-repeat; border: 1px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; color: var(--muted); font-size: 15px; overflow: hidden; }
.thumb.l { width: 72px; height: 72px; font-size: 20px; }
.thumb.has { color: transparent; }

/* kartu PO */
.po { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: left; min-width: 0; width: 100%; }
button.po:hover { border-color: var(--accent); }
.po .name { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.15; letter-spacing: .01em; overflow-wrap: anywhere; }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stages.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stg .n { font-family: var(--f-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stg .l { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stg i { display: block; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.stg i b { display: block; height: 100%; border-radius: 3px; background: var(--c, var(--accent)); }
.stg.z .n { color: var(--muted); font-weight: 600; }
.c-potong { --c: var(--s-potong); } .c-maklon { --c: var(--s-maklon); } .c-cek { --c: var(--s-cek); } .c-qc { --c: var(--s-qc); } .c-jual { --c: var(--s-jual); } .c-qc-wait { --c: var(--warn); }

/* corong alur */
.flow { display: flex; height: 26px; border-radius: 7px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.flow b { display: block; background: var(--c); min-width: 3px; }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
@media (min-width: 620px) { .legend { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.legend div { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; transform: translateY(1px); }
.legend span { font-size: 13px; color: var(--ink-2); flex: 1 1 auto; min-width: 0; }
.legend b { font-family: var(--f-display); font-size: 17px; font-variant-numeric: tabular-nums; }

/* tabel */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-s); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); }
.tbl .z { color: var(--muted); }

/* ---------- lembar (modal) ---------- */
#modal { position: fixed; inset: 0; z-index: 50; }
.layer { position: absolute; inset: 0; }
.scrim { position: absolute; inset: 0; background: rgba(10, 12, 8, .55); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 94%; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
.sheet-h h2 { flex: 1 1 auto; min-width: 0; font-size: 19px; }
.sheet-b { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; flex: none; }
.sheet-f .btn { flex: 1 1 0; }
@media (min-width: 720px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 48px); border-radius: 16px; animation: none; }
  .sheet.wide { width: min(860px, calc(100% - 32px)); }
  .sheet.dialog { width: min(420px, calc(100% - 32px)); }
}
@media (prefers-reduced-motion: reduce) { .sheet, .sync.busy .dot, .btn.loading::after { animation: none; } }
#toast { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: 100%; }
.toast.bad { background: var(--bad); color: #fff; }

/* ---------- masuk ---------- */
/* tinggi satu layar penuh supaya layar masuk dan layar memuat berada di tengah layar, bukan menempel di atas */
.gate, .splash { min-height: 100vh; min-height: 100dvh; }
.gate { display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.gate-in { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 18px; }
.gate .logo { font-family: var(--f-display); font-weight: 700; font-size: 34px; letter-spacing: .05em; text-transform: uppercase; line-height: 1; }
.gate .logo i { font-style: normal; color: var(--accent); }
.gate .tag { color: var(--muted); font-size: 14px; }
.dots { display: flex; gap: 12px; justify-content: center; min-height: 20px; align-items: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
.dots i.f { background: var(--accent); border-color: var(--accent); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button { height: 58px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 24px; }
.pad button:active { background: var(--accent-soft); }
.pad button.x { background: none; border-color: transparent; font-family: var(--f-body); font-size: 14px; font-weight: 600; color: var(--muted); }

/* ---------- slip ---------- */
.slip { border: 1px dashed var(--muted); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.slip .kop { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.slip .kop b { font-family: var(--f-display); font-size: 19px; letter-spacing: .04em; text-transform: uppercase; }
.kv { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 4px 10px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.total-big { font-family: var(--f-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.prog { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog b { display: block; height: 100%; background: var(--accent); }
.steps { display: flex; flex-direction: column; gap: 0; counter-reset: s; }
.steps li { list-style: none; position: relative; padding: 0 0 14px 34px; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
ol.steps { margin: 0; padding: 0; }

/* ---------- versi 1.3: menu tambahan, stok bahan, gaji harian, pratinjau slip ---------- */
@media (max-width: 899px) {
  .nav button.lebih { display: none; }
  .nav button.on-hp { color: var(--accent); }
  .nav button.on-hp::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
}
.stok-rinci { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stok-rinci > div { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stok-rinci b { font-variant-numeric: tabular-nums; font-size: 14.5px; overflow-wrap: anywhere; }
.item .n small { font-family: var(--f-body); font-weight: 500; }
table.gaji-grid th, table.gaji-grid td { text-align: center; padding: 6px 5px; }
table.gaji-grid th:first-child, table.gaji-grid td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 120px; white-space: normal; }
table.gaji-grid thead th:first-child { background: var(--surface-2); }
table.gaji-grid select { min-height: 38px; padding: 4px 2px; width: 52px; text-align: center; text-align-last: center; font-weight: 600; }
table.gaji-grid input { min-height: 38px; width: 70px; padding: 4px 6px; text-align: center; }
table.gaji-grid td:last-child, table.gaji-grid th:last-child { text-align: right; white-space: nowrap; }
table.gaji-grid tfoot td { text-align: right; }
.slip-pratinjau { background: #e9edf2; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; overflow-x: auto; }
.slip-pratinjau .sa-slip-sheet:last-child { margin-bottom: 0; }
@media (max-width: 650px) { .slip-pratinjau { padding: 8px; } }

</style>
</head>

/* ---------- util ---------- */
function corePad(n, w) { var s = String(n); while (s.length < w) s = '0' + s; return s; }
function coreYmd(d) { return d.getFullYear() + '-' + corePad(d.getMonth() + 1, 2) + '-' + corePad(d.getDate(), 2); }
function coreParseJSON(s, fallback) {
  if (s === null || s === undefined || s === '') return fallback;
  if (typeof s === 'object') return s;
  try { var v = JSON.parse(s); return (v === null || v === undefined) ? fallback : v; } catch (e) { return fallback; }
}
function coreNum(v) { var n = Number(v); return isNaN(n) || !isFinite(n) ? 0 : n; }
function coreInt(v) { return Math.round(coreNum(v)); }
function coreSumSizes(obj) { var t = 0; if (obj && typeof obj === 'object') for (var k in obj) t += coreNum(obj[k]); return t; }
function coreCleanSizes(obj) {
  var out = {};
  if (obj && typeof obj === 'object') for (var k in obj) {
    var n = coreInt(obj[k]); var key = String(k).trim().toUpperCase();
    if (n > 0 && key) out[key] = (out[key] || 0) + n;
  }
  return out;
}
function coreIsAdmin(u) { return !!(u && DIVISI[u.divisi] && DIVISI[u.divisi].admin); }
function coreTitle(s) {
  return String(s || '').toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }).trim();
}
function coreRibuan(n) {
  var neg = n < 0; var s = Math.round(Math.abs(coreNum(n))).toString(); var out = '';
  while (s.length > 3) { out = '.' + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? '-' : '') + s + out;

      var i = raw.indexOf('|'); if (i > 0) S.img[id] = { ver: raw.slice(0, i), data: raw.slice(i + 1) };

/* kecilkan gambar sampai muat di satu sel Google Sheets */
function shrinkDataUrl(src) {
  return new Promise(function (resolve, reject) {
    var im = new Image();
    im.onerror = function () { reject(new Error('Gambar tidak terbaca.')); };
    im.onload = function () {
      var side = 360, q = 0.8, out = '';
      for (var i = 0; i < 6; i++) {
        var k = Math.min(1, side / Math.max(im.width, im.height));
        var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length <= MAX_GAMBAR - 2000) return resolve(out);
        side = Math.round(side * 0.82); q -= 0.08;

}

/* ---------- lembar bertumpuk ---------- */
var sheets = [];
function sheetHtml(title, body, footer) {
  return '<div class="sheet-h"><h2 class="cut">' + esc(title) + '</h2><button class="icon-btn" data-a="close" aria-label="Tutup">' + ic('x') + '</button></div>' +
    '<div class="sheet-b">' + body + '</div>' + (footer ? '<div class="sheet-f">' + footer + '</div>' : '');
}
/* Tiap lembar punya elemen sendiri. Lembar di bawahnya disembunyikan, bukan digambar ulang,
   supaya isian form tidak hilang saat ada dialog konfirmasi di atasnya. */
function showSheets() {
  var m = $('#modal'); if (!m) return;
  m.hidden = !sheets.length; document.body.classList.toggle('lock', !!sheets.length);
  sheets.forEach(function (s, i) { s.node.hidden = i !== sheets.length - 1; });
}
function paintTop() {
  var s = sheets[sheets.length - 1]; if (!s) return;
  var sb = $('.sheet-b', s.node); var y = sb ? sb.scrollTop : 0;
  s.node.innerHTML = '<div class="scrim" data-a="close"></div><div class="sheet ' + s.cls + '" role="dialog" aria-modal="true">' + s.render() + '</div>';
  sb = $('.sheet-b', s.node); if (sb) sb.scrollTop = y;
  $$('[data-form]', s.node).forEach(recalc);
  hydrateImages();
}
function openSheet(render, opt) {
  var m = $('#modal'); if (!m) return;
  var node = document.createElement('div'); node.className = 'layer';
  m.appendChild(node);
  sheets.push({ render: render, live: !!(opt && opt.live), cls: (opt && opt.cls) || '', node: node });
  showSheets(); paintTop();
}
function dropSheet(i) {
  var s = sheets[i]; if (!s) return;
  var wasTop = i === sheets.length - 1;
  sheets.splice(i, 1); if (s.node.parentNode) s.node.parentNode.removeChild(s.node);
  showSheets();
  var t = sheets[sheets.length - 1]; if (wasTop && t && t.live) paintTop();
}
function closeSheet() { dropSheet(sheets.length - 1); }
function closeAll() { while (sheets.length) { var s = sheets.pop(); if (s.node.parentNode) s.node.parentNode.removeChild(s.node); } showSheets(); }
A.close = function (el) {
  var s = sheets[sheets.length - 1]; if (!s) return;
  if (el && el.classList.contains('scrim') && $('[data-form]', s.node)) return;   /* form tidak tertutup karena salah ketuk di luar */
  closeSheet();
};

function confirmBox(o, fn) {
  S.confirm = fn;
  openSheet(function () {
    return sheetHtml(o.title || 'Yakin?', '<p>' + esc(o.text || '') + '</p>',
      '<button class="btn" data-a="close">Batal</button><button class="btn ' + (o.danger ? 'danger' : 'pri') + '" data-a="confirmOk">' + esc(o.ok || 'Ya') + '</button>');
  }, { cls: 'dialog' });
}
A.confirmOk = function (el) {
  var fn = S.confirm; var mine = sheets[sheets.length - 1];
  if (!fn) return closeSheet();
  Promise.resolve(fn(el)).then(function () { var i = sheets.indexOf(mine); if (i >= 0) dropSheet(i); }, function () {});
};

/* tombol menunjukkan sedang memproses; kegagalan tampil sebagai pesan */
function act(el, p) {
  if (el) el.classList.add('loading');
  return p.then(function (v) { if (el) el.classList.remove('loading'); return v; },
    function (e) { if (el) el.classList.remove('loading'); toast((e && e.message) || 'Gagal. Coba lagi.', true); throw e; });
}
function quiet() {}

/* ---------- gambar ulang ---------- */
function inputAktif() { var a = document.activeElement; return !!(a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function refresh() {
  if (inputAktif()) S.pending = true; else render();
  var top = sheets[sheets.length - 1];
  if (top && top.live) paintTop();
}
function paintList() { var el = $('#list'); if (el && S.listFn) { el.innerHTML = S.listFn(); hydrateImages(); } }

function render() {
  var root = $('#app'); if (!root) return;
  S.pending = false; S.listFn = null;
  if (!S.state) { root.innerHTML = gateHtml(); return; }
  var tabs = tabsFor();
  if (!tabs.some(function (t) { return t.id === S.tab; })) S.tab = tabs[0].id;
  var pips = navPips();
  var diLebih = tabs.some(function (t) { return t.id === S.tab && t.lebih; });
  var nav = tabs.map(function (t) {
    var cls = (t.id === S.tab ? 'on' : '') + (t.lebih ? ' lebih' : '') + (t.id === 'lain' && diLebih ? ' on-hp' : '');
    return '<button data-a="tab" data-id="' + t.id + '"' + (cls.trim() ? ' class="' + cls.trim() + '"' : '') + (t.id === S.tab ? ' aria-current="page"' : '') + '>' + ic(t.icon) + '<span>' + t.label + '</span>' +
      (pips[t.id] ? '<span class="pip">' + pips[t.id] + '</span>' : '') + '</button>';
  }).join('');
  var u = me();
  var bagian = appLabel(isAdmin() ? '' : u.divisi);
  try { document.title = S.state.settings.namaUsaha + ' ' + bagian; } catch (e) {}
  root.innerHTML = '<div class="app">' + demoBar() +
    (S.versiBaru ? '<div class="demo-bar" style="background:var(--accent-soft);color:var(--accent)"><span>Versi baru aplikasi sudah siap.</span><button class="btn sm pri" data-a="muatVersi">Muat ulang</button></div>' : '') +
    (S.canInstall ?'<div class="demo-bar" style="background:var(--accent-soft);color:var(--accent)"><span>Aplikasi ini bisa dipasang di perangkat Anda.</span><button class="btn sm pri" data-a="install">Pasang</button></div>' : '') +
    '<header class="top"><div class="top-in">' + logoImg() + '<span class="brand grow cut">' + esc(S.state.settings.namaUsaha) + ' <i>' + esc(bagian) + '</i></span>' +
    '<button class="sync" id="sync" data-a="syncNow" title="Muat ulang data"><span class="dot"></span><span id="sync-t"></span></button>' +
    '<button class="who" data-a="tab" data-id="' + (isAdmin() ? 'lain' : 'akun') + '"><span class="ava">' + esc(inisial(u.nama)) + '</span><span class="cut">' + esc(u.nama) + '</span></button></div></header>' +
    '<div class="body"><nav class="nav" aria-label="Menu">' + nav + '</nav><main class="page" id="page">' + VIEWS[S.tab]() + '</main></div></div>';
  $$('#page [data-form]').forEach(recalc);      /* form yang berada langsung di halaman (bukan di lembar) juga dihitung */
  paintSync(); hydrateImages();
}
/* nama aplikasi mengikuti divisinya: Soldier Potong, Soldier Jahit, Soldier QC; owner dan admin: Soldier Produksi */
function appLabel(div) { return DIV_APP[div] ? DIV_APP[div].nama : 'Produksi'; }

  if (isAdmin()) {
    if (cek) o.beranda = cek;

    if (tipis) o.stok = tipis;

/* ---------- layar masuk ---------- */

   Daftar nama baru muncul setelah tombol Masuk ditekan. Layar depan tidak butuh data server, jadi langsung tampil. */

}

function gateHtml() {
  var g = S.gate; var b = S.boot;
  var nama = (b && b.namaUsaha) || 'Soldier';
  var kunci = Api.div();
  var head = '<div class="row">' + logoImg('l') + '<div class="grow"><div class="logo">' + esc(nama) + ' <i>' + esc(appLabel(kunci)) + '</i></div><div class="tag">' +

  try { document.title = nama + ' ' + appLabel(kunci); } catch (e) {}
  if (gateDepan()) {
    return '<div class="gate"><div class="gate-in">' + head + '<div class="card col gap-l"><div class="col gap-s"><div class="label">Divisi</div><h1 style="margin:0">' + esc(DIV_APP[kunci].nama) + '</h1>' +
      '<p class="muted small" style="margin:0">Tekan Masuk, pilih nama Anda, lalu masukkan PIN.</p></div>' +
      '<button class="btn pri" data-a="gateBuka">Masuk' + ic('chev') + '</button></div>' + installBtn() + '</div></div>';
  }
  /* layar memuat: logo di tengah (hanya saat sesi yang tersimpan sedang diperiksa, atau di aplikasi owner yang belum pernah dibuka) */
  if (g.loading && !g.needLink && (S.token || !kunci)) return '<div class="splash">' + logoImg('xl napas') + '<div class="logo">' + esc(nama) + ' <i>' + esc(appLabel(kunci)) + '</i></div><div class="tag">Memuat…</div></div>';
  var body;
  if (g.needLink) {
    /* versi yang dipasang di alamat web sendiri: tanpa link dari owner, aplikasi tidak tahu data pusatnya di mana */
    body = '<div class="card col"><h2>Sambungkan ke data pusat</h2><p class="muted small">Buka link yang dikirim owner, atau tempel link itu di bawah ini. Cukup sekali di perangkat ini.</p>' +
      '<label class="field"><span>Link dari owner</span><input type="text" id="conn-url" placeholder="https://…" autocomplete="off"></label>' +
      '<button class="btn pri" data-a="connectGo">Sambungkan</button></div>';
  }
  else if (g.loading) body = '<div class="card empty"><span>Memuat…</span></div>';
  else if (g.bootErr) body = '<div class="card col"><div class="note bad">' + esc(g.bootErr) + '</div><button class="btn pri" data-a="reboot">Coba lagi</button>' + connectLink() + '</div>';
  else if (!b) body = '';
  else if (b.needSetup && kunci) body = '<div class="card"><div class="note">Aplikasi belum disiapkan owner. Coba lagi setelah owner membuat akunnya.</div></div>';
  else if (b.needSetup) {
    body = '<form class="card col" data-form="setup"><h2>Buat akun owner</h2><p class="muted small">Dilakukan sekali. Akun ini yang memegang semua data dan membuat akun pegawai.</p>' +
      '<label class="field"><span>Nama usaha</span><input type="text" name="namaUsaha" value="' + esc(nama) + '" maxlength="60"></label>' +
      '<label class="field"><span>Nama Anda</span><input type="text" name="nama" maxlength="60" autocomplete="name"></label>' +
      '<div class="f-row"><label class="field"><span>PIN (4–6 angka)</span><input type="password" name="pin" inputmode="numeric" maxlength="6" autocomplete="new-password"></label>' +
      '<label class="field"><span>Ulangi PIN</span><input type="password" name="pin2" inputmode="numeric" maxlength="6" autocomplete="new-password"></label></div>' +
      '<button class="btn pri" data-a="setup">Buat akun &amp; masuk</button></form>' + connectLink();
  } else if (!g.user) {
    var groups = ['owner', 'admin', 'potong', 'jahit', 'qc'];
    var rows = '';
    var luring = g.luring ? '<div class="note bad row"><span class="grow">' + esc(g.luring) + '</span><button class="btn sm" data-a="reboot">Coba lagi</button></div>' : '';
    if (!kunci && !(g.div && DIVISI[g.div])) {
      /* aplikasi owner (tidak dikunci ke satu divisi): layar awal hanya daftar divisi; nama baru muncul setelah divisinya dipilih */
      groups.forEach(function (d) {
        var n = b.users.filter(function (u) { return u.divisi === d; }).length; if (!n) return;
        rows += '<button class="item" data-a="gateDiv" data-id="' + d + '"><span class="ava l">' + esc(inisial(DIVISI[d].label)) + '</span><span class="grow"><span class="t">' + esc(DIVISI[d].label) + '</span><br><span class="d">' + n + ' orang</span></span>' + ic('chev') + '</button>';
      });
      body = luring + '<div class="card flush"><div class="sec-h"><h3>Pilih divisi</h3></div><div class="list">' +
        (rows || emptyBox('Belum ada pegawai.', '<button class="btn sm" data-a="reboot">Muat ulang</button>')) + '</div></div>' + connectLink();
    } else {
      groups.forEach(function (d) {

        b.users.filter(function (u) { return u.divisi === d; }).sort(function (x, y) { return x.nama < y.nama ? -1 : 1; }).forEach(function (u) {
          rows += '<button class="item" data-a="gateUser" data-id="' + esc(u.id) + '"><span class="ava l">' + esc(inisial(u.nama)) + '</span><span class="grow"><span class="t">' + esc(u.nama) + '</span><br><span class="d">' + esc(DIVISI[d].label) + '</span></span>' + ic('chev') + '</button>';

      '<button class="btn ghost sm" data-a="gateBack">Ganti</button></div>' +
      '<div class="col gap-s"><div class="label" style="text-align:center">Masukkan PIN</div><div class="dots" id="dots">' + dots + '</div>' +
      (g.err ? '<div class="note bad" style="text-align:center">' + esc(g.err) + '</div>' : '') + '</div>' +
      '<div class="pad">' + keys + '</div></div>';
  }
  return '<div class="gate"><div class="gate-in">' + head + body + installBtn() + '</div></div>';

function connectLink() {
  var framed = false; try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (Api.mode() === 'gas' || framed) return '';
  /* tombol ganti link hanya muncul kalau sambungannya bermasalah, supaya pegawai tidak memutusnya tanpa sengaja */
  if (Api.mode() === 'remote') return S.gate.bootErr ? '<button class="btn ghost sm" data-a="disconnect">Ganti link data pusat</button>' : '';
  return window.PK_HOSTED ? '' : '<button class="btn ghost sm" data-a="connect">Sambungkan ke data pusat</button>';
}
function installBtn() {
  return S.canInstall ? '<button class="btn" data-a="install">' + ic('down') + 'Pasang aplikasi di perangkat ini</button>' : '';
}
A.reboot = function () { S.gate.bootErr = ''; boot(); };
A.gateUser = function (el) { var id = el.getAttribute('data-id'); S.gate.user = S.boot.users.filter(function (u) { return u.id === id; })[0] || null; S.gate.pin = ''; S.gate.err = ''; render(); };
A.gateBack = function () {
  var g = S.gate; var d = g.user ? g.user.divisi : '';
  g.user = null; g.pin = ''; g.err = ''; LS.del(lastKey());
  /* aplikasi owner: kembali ke daftar nama divisi itu kalau isinya lebih dari satu orang, kalau tidak ke daftar divisi */
  if (!Api.div()) g.div = ((S.boot && S.boot.users) || []).filter(function (u) { return u.divisi === d; }).length > 1 ? d : '';
  render();
};
A.pin = function (el) { pinKey(el.getAttribute('data-k')); };
function pinKey(k) {
  var g = S.gate; if (!g.user || g.sending) return;
  if (k === 'back') g.pin = g.pin.slice(0, -1); else if (g.pin.length < 6) g.pin += k;
  g.err = '';
  var d = $('#dots'); if (!d) return render();
  var h = ''; for (var i = 0; i < Math.max(4, g.pin.length); i++) h += '<i' + (i < g.pin.length ? ' class="f"' : '') + '></i>'; d.innerHTML = h;
  var note = $('.gate .note.bad'); if (note) note.hidden = true;
}
A.pinGo = function () {
  var g = S.gate; if (!g.user || g.sending) return;
  if (g.pin.length < 4) { g.err = 'PIN minimal 4 angka.'; return render(); }
  g.sending = true; var btn = $('#pin-go'); if (btn) btn.textContent = '…';
  Api.call('login', { userId: g.user.id, pin: g.pin }).then(function (res) {
    g.sending = false;
    if (res && res.salah) { g.pin = ''; g.err = res.pesan; return render(); }
    S.token = res.token; LS.set(tokenKey(), res.token); LS.set(lastKey(), g.user.id);
    S.gate = { user: null, pin: '', err: '', setup: null }; S.tab = '';
    applyState(res.state); startSync(); render();
  }, function (e) { g.sending = false; g.pin = ''; g.err = e.message || 'Gagal masuk.'; render(); });
};
A.setup = function (el) {

function historyCorrectionInput(form, model) {
  var values = formVals(form), ukuran = sizeVals(form), reason = String(values.reason || '').trim();

  return { ukuran: ukuran, reason: reason };

function slipTeks(v) { return String(v === undefined || v === null ? '' : v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, ''); }

}
function slipNormal(m) {

  function tabel(cols, rows) {
    return { columns: cols.map(function (c) { return { label: slipTeks(c.label), align: (c.align === 'right' || c.align === 'center') ? c.align : 'left', width: parseFloat(c.width) || 0 }; }),
      rows: rows.map(function (r) { if (!(r instanceof Array) || r.length !== cols.length) throw new Error('Kolom rincian slip tidak sesuai.'); return r.map(slipTeks); }) };
  }
  var utama = tabel(m.columns, m.rows);
  return { layout: (m.layout === 'weekly-a4' || m.layout === 'four-up') ? m.layout : '', title: slipTeks(m.title), reference: slipTeks(m.reference), recipient: slipTeks(m.recipient),
    recipientLabel: slipTeks(m.recipientLabel || 'Penerima'), period: slipTeks(m.period), columns: utama.columns, rows: utama.rows,
    summary: (m.summary || []).map(function (s) { return { label: slipTeks(s.label), value: slipTeks(s.value), emphasis: !!s.emphasis }; }),
    sections: (m.sections || []).map(function (s) { var t = tabel(s.columns, s.rows); return { title: slipTeks(s.title), columns: t.columns, rows: t.rows }; }),
    signatures: (m.signatures || []).map(function (s) { return { label: slipTeks(s.label), name: slipTeks(s.name) }; }) };
}
function slipTabel(cols, rows) {
  var sum = 0; cols.forEach(function (c) { sum += c.width > 0 ? c.width : 0; });
  var pakai = sum > 0 && cols.every(function (c) { return c.width > 0; });
  var cls = function (c) { return c.align === 'right' ? 'sa-slip-num' : (c.align === 'center' ? 'sa-slip-center' : ''); };
  return '<div class="sa-slip-table-scroll"><table>' + (pakai ? '<colgroup>' + cols.map(function (c) { return '<col style="width:' + (100 * c.width / sum) + '%">'; }).join('') + '</colgroup>' : '') +
    '<thead><tr>' + cols.map(function (c) { return '<th class="' + cls(c) + '">' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) { return '<tr>' + r.map(function (v, i) { return '<td class="' + cls(cols[i]) + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}

/* kecilkan huruf sampai tiap slip muat di kotaknya; slip yang tetap terlalu panjang dipindah ke lembar sendiri. Baris tidak pernah dipotong. */
function slipPaskan(doc) {
  Array.prototype.slice.call(doc.querySelectorAll('.sa-slip-sheet')).forEach(function (sheet) {
    Array.prototype.slice.call(sheet.querySelectorAll('.sa-slip-slot')).forEach(function (slot) {

    var selesai = false; var timer = null;
    var bersih = function () { clearTimeout(timer); setTimeout(function () { if (frame.parentNode) frame.parentNode.removeChild(frame); }, 1000); };
    var gagal = function (e) { if (selesai) return; selesai = true; clearTimeout(timer); if (frame.parentNode) frame.parentNode.removeChild(frame); reject(e); };
    frame.onload = function () {
      if (selesai) return;

        var gambar = Array.prototype.slice.call(doc.images || []);

          if (selesai) return;

          if (typeof window.PK_UJI_CETAK === 'function') { clearTimeout(timer); window.PK_UJI_CETAK(doc, frame); resolve(); return; }

/* ============================================================
   UI bagian 4d — Gaji harian, kasbon, slip mingguan (hanya owner / admin)
   Tab dan istilahnya mengikuti aplikasi lama: Input Mingguan, Kasbon,
   Slip Print, Rekap, Karyawan. Minggu = Senin sampai Minggu.
   ============================================================ */

function karyawanById(id) { var hit = null; (S.state.karyawan || []).forEach(function (k) { if (k.id === id) hit = k; }); return hit; }
function karyawanUrut(list) { return list.slice().sort(function (a, b) { return a.nama.toLowerCase() < b.nama.toLowerCase() ? -1 : 1; }); }
function gajiDiPeriode(periode, karyawanId) { return (S.state.gaji || []).filter(function (g) { return g.periode === periode && (!karyawanId || g.karyawanId === karyawanId); }); }
function periodeGaji() { var set = {}; (S.state.gaji || []).forEach(function (g) { if (g.periode) set[g.periode] = 1; }); return Object.keys(set); }
function kasbonSemua() { return coreKasbon(S.state.kasbon || []); }
var LABEL_HARI = { full: 'Full', half: '½ Hari', absent: 'Absen', off: 'Libur' };
/* ringkasan satu karyawan pada satu periode, dari nominal yang tersimpan (bukan dari tarif sekarang) */
function ringkasGaji(periode, karyawanId) {
  var rows = gajiDiPeriode(periode, karyawanId);
  var o = { rows: rows, gaji: 0, lemburJam: 0, lembur: 0, sabtuJam: 0, sabtu: 0, lunas: rows.length > 0 };
  rows.forEach(function (g) { o.gaji += coreNum(g.gaji); o.lemburJam += coreNum(g.lemburJam); o.lembur += coreNum(g.lemburTotal); o.sabtuJam += coreNum(g.sabtuJam); o.sabtu += coreNum(g.sabtuTotal); if (!g.lunas) o.lunas = false; });
  o.bruto = o.gaji + o.lembur + o.sabtu;
  o.cicilan = [];
  kasbonSemua().forEach(function (kb) { if (kb.jenis === 'harian' && kb.orangId === karyawanId) kb.cicilan.forEach(function (c) { if (c.periode === periode) o.cicilan.push({ kb: kb, c: c }); }); });
  o.potongan = 0; o.cicilan.forEach(function (x) { o.potongan += x.c.jumlah; });
  o.terima = o.bruto - o.potongan;
  return o;
}

/* ---------- input mingguan ---------- */
function gajiPeriodeAktif() { var id = S.f.gajiPeriode; if (!corePeriode(id)) id = S.f.gajiPeriode = coreMingguId(todayYmd()); return id; }
C.gajiPeriode = function (el) { S.f.gajiPeriode = el.value; S.gajiDraft = null; S.gajiSentuh = false; render(); };
function gajiInputView() {
  var st = S.state; var pid = gajiPeriodeAktif(); var per = corePeriode(pid);
  var opsi = daftarPeriode(periodeGaji()); if (!opsi.some(function (o) { return o[0] === pid; })) opsi.unshift([pid, labelPeriode(pid)]);
  var draft = (S.gajiDraft && S.gajiDraft.periode === pid) ? S.gajiDraft.data : {};
  var adaData = {}; gajiDiPeriode(pid).forEach(function (g) { adaData[g.karyawanId] = 1; });
  var orang = karyawanUrut((st.karyawan || []).filter(function (k) { return k.aktif || adaData[k.id]; }));
  var tools = '<div class="tools"><select data-c="gajiPeriode" style="flex:1 1 240px" aria-label="Pilih minggu">' + opsi.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === pid ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>' +
    '<button class="btn" data-a="gajiRentang">Rentang tanggal lain</button></div>';
  if (!orang.length) return tools + '<div class="card">' + emptyBox('Belum ada karyawan harian.', '<button class="btn sm pri" data-a="sub" data-k="gaji" data-v="karyawan">Tambah karyawan</button>') + '</div>';
  var th = '<th>Karyawan</th>' + per.dates.map(function (d) { return '<th>' + HARI3[coreHariKe(d)] + '<br><span class="xs">' + d.slice(8) + '/' + d.slice(5, 7) + '</span></th>'; }).join('') + '<th>Lembur<br><span class="xs">jam</span></th><th>Lembur Sabtu<br><span class="xs">jam</span></th><th>Total</th>';
  var body = orang.map(function (k) {
    var r = ringkasGaji(pid, k.id); var byTgl = {}; r.rows.forEach(function (g) { byTgl[g.tanggal] = g; });
    var d = draft[k.id] || null; var kunci = r.lunas;
    var cells = per.dates.map(function (tg) {
      var status = d ? d.hari[tg] : (byTgl[tg] ? byTgl[tg].status : (coreHariKe(tg) === 0 ? 'off' : 'full'));
      return '<td><select data-tgl="' + tg + '" aria-label="' + esc(k.nama) + ' ' + tg + '"' + (kunci ? ' disabled' : '') + '>' + [['full', 'F'], ['half', '½'], ['absent', 'A'], ['off', '—']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === status ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></td>';
    }).join('');
    var lj = d ? d.lemburJam : (r.lemburJam || ''); var sj = d ? d.sabtuJam : (r.sabtuJam || '');
    return '<tr data-kar="' + esc(k.id) + '" data-gaji="' + coreNum(k.gajiHarian) + '" data-lembur="' + coreNum(k.lembur) + '" data-sabtu="' + coreNum(k.lemburSabtu) + '"' + (kunci ? ' data-kunci="1" data-tetap="' + r.bruto + '"' : '') + '>' +
      '<td><b>' + esc(k.nama) + '</b>' + (k.jabatan ? '<br><span class="xs muted">' + esc(k.jabatan) + '</span>' : '') + (kunci ? '<br><span class="chip ok">Dibayar</span>' : (r.rows.length ? '' : '<br><span class="xs muted">belum disimpan</span>')) + '</td>' + cells +
      '<td><input type="number" inputmode="decimal" min="0" step="0.5" data-lj value="' + esc(lj) + '" placeholder="0" title="Tarif ' + esc(rp(k.lembur)) + ' per jam"' + (kunci ? ' disabled' : '') + '></td>' +
      '<td><input type="number" inputmode="decimal" min="0" step="0.5" data-sj value="' + esc(sj) + '" placeholder="0" title="Tarif ' + esc(rp(k.lemburSabtu)) + ' per jam"' + (kunci ? ' disabled' : '') + '></td>' +
      '<td class="b" data-tot>Rp 0</td></tr>';
  }).join('');
  return tools + '<div class="small muted">Periode ' + tglSlip(per.start) + ' — ' + tglSlip(per.end) + ' · ' + per.dates.length + ' hari. F = hadir penuh, ½ = setengah hari, A = absen, — = libur.</div>' +
    '<div class="card flush" data-form="gajiGrid" data-periode="' + esc(pid) + '"><div class="tbl-wrap" style="border:0"><table class="tbl gaji-grid"><thead><tr>' + th + '</tr></thead><tbody>' + body + '</tbody>' +
    '<tfoot><tr><td colspan="' + (per.dates.length + 3) + '">Total minggu ini</td><td data-grand>Rp 0</td></tr></tfoot></table></div></div>' +
    '<div class="row wrap"><span class="grow small muted" id="gaji-kotor">' + (S.gajiDraft && S.gajiDraft.periode === pid ? 'Ada isian yang belum disimpan.' : '') + '</span><button class="btn pri" data-a="gajiSave">' + ic('check') + 'Simpan minggu ini</button></div>';
}
/* hitung ulang total tiap baris; isian yang belum disimpan dipegang di S.gajiDraft supaya tidak hilang saat data lain masuk */
R.gajiGrid = function (f) {
  var grand = 0; var data = {}; var berubah = false;
  $$('tr[data-kar]', f).forEach(function (tr) {
    var tot;
    if (tr.getAttribute('data-kunci')) tot = coreNum(tr.getAttribute('data-tetap'));
    else {
      var gaji = coreNum(tr.getAttribute('data-gaji')); var hari = {}; tot = 0;
      $$('select[data-tgl]', tr).forEach(function (s) { hari[s.getAttribute('data-tgl')] = s.value; tot += coreGajiHari(s.value, gaji); });
      var lj = coreNum($('[data-lj]', tr).value), sj = coreNum($('[data-sj]', tr).value);
      tot += Math.round(lj * coreNum(tr.getAttribute('data-lembur'))) + Math.round(sj * coreNum(tr.getAttribute('data-sabtu')));
      data[tr.getAttribute('data-kar')] = { hari: hari, lemburJam: $('[data-lj]', tr).value, sabtuJam: $('[data-sj]', tr).value };
    }
    $('[data-tot]', tr).textContent = rp(tot); grand += tot;
  });
  $('[data-grand]', f).textContent = rp(grand);
  if (S.gajiSentuh) { S.gajiDraft = { periode: f.getAttribute('data-periode'), data: data }; var k = $('#gaji-kotor'); if (k) k.textContent = 'Ada isian yang belum disimpan.'; }
};

/* Antrean QC: slip setor yang sudah dihitung dan belum selesai diperiksa, yang paling lama di atas.
   Hasil QC yang dicatat per slip mengurangi slip itu. Hasil QC lama yang dicatat per PO (tanpa slip)
   dianggap menghabiskan slip PO itu mulai dari yang paling tua. */
function categorySizes(row, field, scalar) {
  var value = coreParseJSON(row[field], {});
  if (Object.keys(value).length || !coreNum(row[scalar])) return value;
  var sizes = Object.keys(coreParseJSON(row.ukuran, {}));
  var slip = row.setorId ? findSlip('setor', row.setorId) : null;
  if (sizes.length !== 1 && slip) sizes = Object.keys(slip.ukuran || {});
  if (sizes.length === 1) { value[sizes[0]] = coreNum(row[scalar]); }
  return value;
}
function antreanQC() {
  var st = S.state, out = [], used = {};
  st.qc.forEach(function (q) {
    if (!q.setorId || q.repairQcId || q.perbaikan < 0 || (Number(q.workflowVersion) === 1 && q.autoFromCount)) return;
    var u = used[q.setorId] || (used[q.setorId] = {});
    [coreParseJSON(q.ukuran, {}), categorySizes(q, 'offlineUkuran', 'offline'), categorySizes(q, 'perbaikanUkuran', 'perbaikan'), categorySizes(q, 'rejectUkuran', 'reject')].forEach(function (map) {
      Object.keys(map).forEach(function (size) { u[size] = (u[size] || 0) + coreNum(map[size]); });
    });
  });
  st.setor.filter(function (r) { return r.status === 'diterima' && D.po[r.poId] && D.po[r.poId].status === 'aktif'; }).forEach(function (r) {
    var flow = workflowFor(D.po[r.poId]), ready = {}, waiting = {};
    Object.keys(r.ukuran || {}).forEach(function (size) {
      var remaining = coreNum(r.ukuran[size]) - coreNum((used[r.id] || {})[size]);
      var blocked = (flow.blockedQcSources && flow.blockedQcSources[r.id] || []).indexOf(size) >= 0;
      if (remaining > 0) (flow.ukuran[size] && flow.ukuran[size].readyQC && !flow.issues.length && !blocked ? ready : waiting)[size] = remaining;
    });
    var total = coreSumSizes(ready);
    if (total) out.push({ s: r, sisa: total, uk: ready, waiting: waiting });
  });
  return out.sort(function (a, b) { return String(a.s.tanggal).localeCompare(String(b.s.tanggal)) || String(a.s.id).localeCompare(String(b.s.id)); });
}
function repairQueue(poId) {
  return S.state.qc.filter(function (q) { return q.poId === poId && !q.repairQcId && q.perbaikan > 0; }).map(function (q) {
    var remaining = Object.assign({}, categorySizes(q, 'perbaikanUkuran', 'perbaikan'));
    S.state.qc.filter(function (r) { return r.repairQcId === q.id; }).forEach(function (r) {
      [coreParseJSON(r.ukuran, {}), categorySizes(r, 'offlineUkuran', 'offline'), categorySizes(r, 'rejectUkuran', 'reject')].forEach(function (map) {
        Object.keys(map).forEach(function (size) { remaining[size] = coreNum(remaining[size]) - coreNum(map[size]); });
      });
    });
    Object.keys(remaining).forEach(function (size) { if (remaining[size] <= 0) delete remaining[size]; });
    return { q: q, uk: remaining, total: coreSumSizes(remaining) };
  }).filter(function (r) { return r.total > 0; });
}

}
